name: Tracker510

on:
  schedule:
    # Dit start de actie automatisch elke 5 minuten (de stabiele limiet voor gratis GitHub-accounts)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Hiermee kunnen we hem zometeen handmatig testen

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Haal live data op
        run: |
          RESPONSE=$(curl -s "https://ovapi.nl")
          if [ -z "$RESPONSE" ]; then
            echo '{"isLive": false, "error": "Geen data ontvangen van Bison"}' > live-bus.json
          else
            # Filter direct op lijn 510 via de ingebouwde jq-tool
            BUS=$(echo "$RESPONSE" | jq '.Notification.Records[] | select(.LinePlanningNumber=="510" or .UserTransitCode=="510")' | head -n 1)
            if [ -z "$BUS" ] || [ "$BUS" = "null" ]; then
              echo '{"isLive": false, "msg": "Geen actieve bus op Lijn 510 gedetecteerd"}' > live-bus.json
            else
              LAT=$(echo "$BUS" | jq '.Latitude')
              LON=$(echo "$BUS" | jq '.Longitude')
              SPD=$(echo "$BUS" | jq '.Speed')
              # Bereken km/u (snelheid * 3.6)
              KMH=$(python3 -c "print(round($SPD * 3.6))" 2>/dev/null || echo "0")
              
              echo "{\"isLive\": true, \"latitude\": $LAT, \"longitude\": $LON, \"speed\": $KMH}" > live-bus.json
            fi
          fi

      - name: Push data naar repository
        run: |
          git config --global user.name "GitHub Bot"
          git config --global user.email "actions@github.com"
          git add live-bus.json
          git diff-index --quiet HEAD || (git commit -m "Update GPS 510" && git push)
