name: LiveTracker510

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ophalen openbare voertuigposities
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");

            // We halen het superlichte, ongecomprimeerde JSON-pakketje van lijn 510 op
            https.get("https://api.9292.nl/journey/qbuzz/v510", (res) => {
              let data = "";
              res.on("data", (chunk) => { data += chunk; });
              res.on("end", () => {
                try {
                  const json = JSON.parse(data);
                  
                  // Controleer of er realtime trips aanwezig zijn in de 9292 data
                  if (json && json.realtimeTrips && json.realtimeTrips.length > 0) {
                    const trip = json.realtimeTrips[0];
                    const lat = trip.latitude;
                    const lon = trip.longitude;
                    
                    if (lat && lon) {
                      fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: true, latitude: parseFloat(lat), longitude: parseFloat(lon), speed: 35 }, null, 2));
                      console.log("Bus succesvol gevonden!");
                      return;
                    }
                  }
                  
                  // Als er geen actieve bus in de data zit (buiten dienstregeling of geen GPS-fix)
                  fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Bus 510 (Veendam) is momenteel niet live (buiten dienstregeling)" }, null, 2));
                } catch (e) {
                  fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Fout bij parsen data" }, null, 2));
                }
              });
            }).on("error", (err) => {
              fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Verbindingsfout naar 9292" }, null, 2));
            });
          '

      - name: Veilig Commit en Push
        run: |
          git config --global user.name "GitHub Bot"
          git config --global user.email "actions@github.com"
          
          # Haal eerst eventuele handmatige wijzigingen/verwijderingen van de website binnen
          git pull origin main --rebase
          
          # Voeg het bestand toe en commit altijd geforceerd
          git add live-bus.json
          git commit -m "Update GPS Bus 510 [skip ci]" --allow-empty
          
          # Push de boel definitief live naar je repository
          git push origin main
