name: LiveTracker510

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ophalen openbare voertuigposities
        run: |
          # 1. Download de data rechtstreeks naar een tijdelijk bestand
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          curl -s -A "$UA" --connect-timeout 10 --max-time 60 --retry 3 https://vps.openov.nl/kv6posinfo/vehiclePositions.json > raw-positions.json

          # 2. Filter direct met jq vanuit het bestand naar een variabele
          BUS=$(jq '[.. | objects | select((.LinePlanningNumber=="510" or .UserTransitCode=="510" or .linePlanningNumber=="510") and (.DataOwnerCode=="QBUZZ" or .dataOwnerCode=="QBUZZ"))] | .[0]' raw-positions.json 2>/dev/null)

          # 3. Controleer de uitkomst
          if [ -z "$BUS" ] || [ "$BUS" = "null" ]; then
            echo '{"isLive": false, "msg": "Bus 510 (Veendam) is momenteel niet live (buiten dienstregeling)"}' > live-bus.json
          else
            LAT=$(echo "$BUS" | jq '.Latitude // .latitude // null')
            LON=$(echo "$BUS" | jq '.Longitude // .longitude // null')
            SPD=$(echo "$BUS" | jq '.Speed // .speed // 0')
            KMH=$(echo "scale=0; ($SPD * 3.6)/1" | bc 2>/dev/null || echo "0")

            if [ "$LAT" != "null" ] && [ "$LON" != "null" ]; then
              echo "{\"isLive\": true, \"latitude\": $LAT, \"longitude\": $LON, \"speed\": $KMH}" > live-bus.json
            else
              echo '{"isLive": false, "msg": "Bus is ingelogd maar verzendt momenteel geen GPS-coördinaten"}' > live-bus.json
            fi
          fi

          # 4. Ruim het tijdelijke megabestand netjes op zodat het niet mee wordt gepusht
          rm -f raw-positions.json
