name: LiveTracker510

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ophalen openbare voertuigposities
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");

            https.get("https://vps.openov.nl/kv6posinfo/vehiclePositions.json", (res) => {
              let data = "";
              res.on("data", (chunk) => { data += chunk; });
              res.on("end", () => {
                try {
                  const json = JSON.parse(data);
                  // We zoeken in de objecten naar Qbuzz lijn 510
                  let gevondenBus = null;
                  
                  for (const key in json) {
                    const pkt = json[key];
                    if (pkt && (pkt.LinePlanningNumber === "510" || pkt.linePlanningNumber === "510") && 
                        (pkt.DataOwnerCode === "QBUZZ" || pkt.dataOwnerCode === "QBUZZ")) {
                      gevondenBus = pkt;
                      break;
                    }
                  }

                  if (!gevondenBus) {
                    fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Bus 510 (Veendam) is momenteel niet live (buiten dienstregeling)" }));
                  } else {
                    const lat = gevondenBus.Latitude || gevondenBus.latitude;
                    const lon = gevondenBus.Longitude || gevondenBus.longitude;
                    const spd = gevondenBus.Speed || gevondenBus.speed || 0;
                    const kmh = Math.round(spd * 3.6);

                    if (lat && lon) {
                      fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: true, latitude: parseFloat(lat), longitude: parseFloat(lon), speed: kmh }));
                    } else {
                      fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Bus is ingelogd maar verzendt momenteel geen GPS-coördinaten" }));
                    }
                  }
                } catch (e) {
                  fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Fout bij verwerken data" }));
                }
              });
            }).on("error", (err) => {
              fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Verbindingsfout" }));
            });
          '
