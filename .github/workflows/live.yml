name: LiveTracker510

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ophalen openbare voertuigposities
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");

            https.get("https://api.9292.nl/journey/qbuzz/v510", (res) => {
              let rawData = "";
              res.on("data", (chunk) => { rawData += chunk; });
              res.on("end", () => {
                // Als de server een foutcode of lege data geeft, schrijf dan direct een nette status
                if (!rawData || rawData.trim() === "" || rawData.includes("DOCTYPE")) {
                  fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Bus 510 (Veendam) is momenteel niet live (buiten dienstregeling)" }, null, 2));
                  return;
                }

                try {
                  const json = JSON.parse(rawData);
                  
                  // Controleer zorgvuldig op de aanwezigheid van realtime ritten
                  if (json && json.realtimeTrips && json.realtimeTrips.length > 0) {
                    const trip = json.realtimeTrips[0];
                    const lat = trip.latitude;
                    const lon = trip.longitude;
                    
                    if (lat && lon) {
                      fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: true, latitude: parseFloat(lat), longitude: parseFloat(lon), speed: 35 }, null, 2));
                      console.log("Bus succesvol gevonden!");
                      return;
                    }
                  }
                  
                  // Standaard fallback als de structuur klopt maar er geen actieve rit in zit
                  fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Bus 510 (Veendam) is momenteel niet live (buiten dienstregeling)" }, null, 2));
                } catch (e) {
                  // Mocht het parsen toch mislukken, zet hem dan netjes op niet-live in plaats van te crashen
                  fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Bus 510 (Veendam) is momenteel niet live (buiten dienstregeling)" }, null, 2));
                }
              });
            }).on("error", (err) => {
              fs.writeFileSync("live-bus.json", JSON.stringify({ isLive: false, msg: "Verbindingsfout naar 9292" }, null, 2));
            });
          '
      - name: Veilig Commit en Push
        run: |
          git config --global user.name "GitHub Bot"
          git config --global user.email "actions@github.com"
          
          # 1. Haal wijzigingen binnen en geef bij een conflict ALTIJD voorrang aan ons eigen nieuwe bestand (ours)
          git pull origin main --rebase -X ours || true
          
          # 2. Voeg het bestand geforceerd toe en commit altijd
          git add live-bus.json
          git commit -m "Update GPS Bus 510 [skip ci]" --allow-empty
          
          # 3. Push de boel definitief live
          git push origin main
