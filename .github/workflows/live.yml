name: LiveTracker510

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ophalen openbare voertuigposities
        run: |
          set +e
          RESPONSE=$(curl -s --max-time 15 "https://bison.ovapi.nl/vehiclePositions.json")
          if [ -z "$RESPONSE" ] || echo "$RESPONSE" | grep -q "DOCTYPE"; then
            echo '{"isLive": false, "msg": "OVapi server onbereikbaar of onderhoud"}' > live-bus.json
          else
            # Waterdicht filter: Selecteert de array én pakt direct het eerste geldige Qbuzz 510 object (.[0])
            BUS=$(echo "$RESPONSE" | jq '[.. | objects | select((.LinePlanningNumber=="510" or .UserTransitCode=="510" or .linePlanningNumber=="510") and (.DataOwnerCode=="QBUZZ" or .dataOwnerCode=="QBUZZ"))] | .[0]')
            if [ -z "$BUS" ] || [ "$BUS" = "null" ] || [ "$BUS" = "[]" ] || [ "$BUS" = "" ]; then
              echo '{"isLive": false, "msg": "Bus 510 (Veendam) is momenteel niet live (buiten dienstregeling)"}' > live-bus.json
            else
              LAT=$(echo "$BUS" | jq '.Latitude // .latitude // null')
              LON=$(echo "$BUS" | jq '.Longitude // .longitude // null')
              SPD=$(echo "$BUS" | jq '.Speed // .speed // 0')
              KMH=$(echo "scale=0; ($SPD * 3.6)/1" | bc 2>/dev/null || echo "0")

              if [ "$LAT" != "null" ] && [ "$LON" != "null" ]; then
                echo "{\"isLive\": true, \"latitude\": $LAT, \"longitude\": $LON, \"speed\": $KMH}" > live-bus.json
              else
                echo '{"isLive": false, "msg": "Bus is ingelogd maar verzendt momenteel geen GPS-coördinaten"}' > live-bus.json
              fi
            fi
          fi
      - name: Veilig Commit en Push
        run: |
          git config --global user.name "GitHub Bot"
          git config --global user.email "actions@github.com"
          git add live-bus.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update GPS Bus 510 [skip ci]"
            git push
          fi
