name: LiveTracker510

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ophalen openbare voertuigposities
        run: |
          # 1. Haal uitsluitend de actuele voertuigen van Qbuzz op via de officiële open data transit API
          curl -s "https://api.entur.io/realtime/v1/vehicles?codespace=QBUZZ" > qbuzz-vehicles.json

          # 2. Filter binnen de Qbuzz data specifiek naar lijn 510
          BUS=$(jq '[.[] | select(.lineRef == "v510" or .lineRef == "510")] | .[0]' qbuzz-vehicles.json 2>/dev/null)

          # 3. Verwerk de data en schrijf de status weg naar live-bus.json
          if [ -z "$BUS" ] || [ "$BUS" = "null" ] || [ "$BUS" = "[]" ]; then
            echo '{"isLive": false, "msg": "Bus 510 (Veendam) is momenteel niet live (buiten dienstregeling)"}' > live-bus.json
          else
            LAT=$(echo "$BUS" | jq '.Latitude // .latitude // null')
            LON=$(echo "$BUS" | jq '.Longitude // .longitude // null')
            SPD=$(echo "$BUS" | jq '.Speed // .speed // 0')
            KMH=$(echo "scale=0; ($SPD * 3.6)/1" | bc 2>/dev/null || echo "0")

            if [ "$LAT" != "null" ] && [ "$LON" != "null" ]; then
              echo "{\"isLive\": true, \"latitude\": $LAT, \"longitude\": $LON, \"speed\": $KMH}" > live-bus.json
            else
              echo '{"isLive": false, "msg": "Bus is ingelogd maar verzendt momenteel geen GPS-coördinaten"}' > live-bus.json
            fi
          fi

          # 4. Ruim het tijdelijke bestand netjes op
          rm -f raw-positions.json
