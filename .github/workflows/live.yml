name: LiveTracker510

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ophalen openbare voertuigposities
        run: |
          # 1. Haal de live data op en sla het op in een bestand
          curl -s "https://api.9292.nl/journey/qbuzz/v510" > response.json
          
          # 2. Print de volledige JSON in de GitHub Actions log zodat we de structuur zien!
          cat response.json

          # 3. Tijdelijke basis-check
          if [ ! -s response.json ] || grep -q "DOCTYPE" response.json; then
            echo '{"isLive": false, "msg": "9292 API onbereikbaar"}' > live-bus.json
          else
            # We schrijven hem tijdelijk direct weg als test
            echo '{"isLive": false, "msg": "Structuur-test actief"}' > live-bus.json
          fi
          
