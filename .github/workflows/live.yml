name: LiveTracker510

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ophalen openbare voertuigposities
        run: |
          # Haal rechtstreeks de actuele ritten voor Lijn 510 in Veendam op via de 9292/OVapi-omgeving
          RESPONSE=$(curl -s "https://api.9292.nl/journey/qbuzz/v510" 2>/dev/null)

          if [ -z "$RESPONSE" ] || echo "$RESPONSE" | grep -q "DOCTYPE"; then
            echo '{"isLive": false, "msg": "Bus 510 (Veendam) is momenteel niet live (buiten dienstregeling)"}' > live-bus.json
          else
            # Pak de realtime positie van de eerste actieve bus uit de data
            LAT=$(echo "$RESPONSE" | jq '.realtimeTrips[0].latitude // null')
            LON=$(echo "$RESPONSE" | jq '.realtimeTrips[0].longitude // null')

            if [ "$LAT" != "null" ] && [ "$LON" != "null" ]; then
              echo "{\"isLive\": true, \"latitude\": $LAT, \"longitude\": $LON, \"speed\": 0}" > live-bus.json
            else
              echo '{"isLive": false, "msg": "Bus 510 (Veendam) is momenteel niet live (buiten dienstregeling)"}' > live-bus.json
            fi
          fi
