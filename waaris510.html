<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Bus 510 Tracker - Veendam</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
        }
        header {
            background-color: #ffc107; color: #333; padding: 15px; text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1000;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        #status { font-size: 0.9rem; margin-top: 5px; font-weight: bold; }
        #map { flex-grow: 1; width: 100%; }
        .online { color: #28a745; }
        .offline { color: #dc3545; }
    </style>
</head>
<body>

    <header>
        <h1>🚌 Live Tracker: Buurtbus 510 Veendam</h1>
        <div id="status">Status: Gegevens ophalen...</div>
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com"></script>
    <script>
        // Initialiseer kaart op Veendam
        const map = L.map('map').setView([53.1017, 6.8742], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(map);

        let busMarker = null;
        const busIcon = L.divIcon({ html: '<span style="font-size: 24px;">🚌</span>', iconSize: [24, 24] });

        async function trackBus() {
            const statusEl = document.getElementById('status');
            
            try {
                // GEOPTIMALISEERD: We vragen specifiek de data van Qbuzz lijn 510 op in plaats van heel Nederland
                // Richting 1 en Richting 2 worden gecombineerd via de lijn-specifieke call
                const response = await fetch('https://ovapi.nl');
                
                if (!response.ok) {
                    statusEl.innerHTML = "🔴 API service is momenteel overbelast. Probeer zo direct nog eens.";
                    statusEl.className = 'offline';
                    return;
                }
                
                const data = await response.json();
                let busFound = false;

                // Loop door de resultaten om te kijken of er een live voertuig (actual) gekoppeld is
                for (const lineKey in data) {
                    const lineData = data[lineKey];
                    
                    // Controleer of er actuele ritten (actuals) actief zijn
                    if (lineData.Actuals) {
                        for (const actualKey in lineData.Actuals) {
                            const actual = lineData.Actuals[actualKey];
                            
                            // Heeft de bus een live GPS positie?
                            if (actual.Latitude && actual.Longitude) {
                                const lat = actual.Latitude;
                                const lng = actual.Longitude;
                                const delay = actual.Delay ? Math.round(actual.Delay / 60) : 0;
                                let delayText = delay === 0 ? "op tijd" : (delay > 0 ? `+${delay} min` : `${delay} min vroeg`);

                                statusEl.innerHTML = `🟢 Bus is LIVE! Bestemming: ${actual.DestinationName || 'Veendam'} (${delayText})`;
                                statusEl.className = 'online';

                                if (busMarker) {
                                    busMarker.setLatLng([lat, lng]);
                                } else {
                                    busMarker = L.marker([lat, lng], { icon: busIcon }).addTo(map);
                                    map.setView([lat, lng], 14); // Automatisch zoomen op de bus
                                }

                                busMarker.bindPopup(`<b>Buurtbus 510</b><br>Status: ${delayText}<br>Laatste update: ${new Date().toLocaleTimeString()}`);
                                busFound = true;
                                break;
                            }
                        }
                    }
                    if (busFound) break;
                }

                if (!busFound) {
                    statusEl.innerHTML = "⏰ De bus rijdt momenteel niet volgens de live dienstregeling (buiten dienst/nacht).";
                    statusEl.className = 'offline';
                    if (busMarker) {
                        map.removeLayer(busMarker);
                        busMarker = null;
                    }
                }

            } catch (error) {
                console.error(error);
                statusEl.innerHTML = "⚠️ Fout bij verbinding maken met de OV-server.";
                statusEl.className = 'offline';
            }
        }

        // Start direct en ververs elke 15 seconden (vriendelijker voor de data)
        trackBus();
        setInterval(trackBus, 15000);
    </script>
</body>
</html>
