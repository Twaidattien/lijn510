<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>waaris510ab03.html - Live Tracker</title>
    
    <!-- Officiële, volledige en stabiele Leaflet kaartstijlen en engine inladen -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Jouw eigen lokale haltelijst inladen -->
    <script src="haltes510.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { background-color: #f0f4f8; display: flex; flex-direction: column; }
        
        header { 
            background-color: #005cbf; color: white; padding: 15px; text-align: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: relative; z-index: 1000;
        }
        header h1 { font-size: 1.4rem; letter-spacing: 0.5px; }
        header p { font-size: 0.85rem; opacity: 0.85; margin-top: 3px; font-weight: bold; color: #ffcc00; }

        .app-container { flex: 1; position: relative; width: 100%; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; z-index: 1; min-height: 40vh; background-color: #e5e5e5; }

        #debug-console {
            background-color: #1e1e1e; color: #00ff00; font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem; padding: 15px; height: 160px; overflow-y: auto;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); border-top: 3px solid #005cbf; z-index: 2000;
        }
        .debug-entry { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 3px; }
        .debug-error { color: #ff3333; font-weight: bold; }
        .debug-success { color: #33ff33; }

        .status-panel {
            position: absolute; top: 20px; left: 20px; background: white; padding: 15px 20px; 
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 2000;
            display: flex; align-items: center; gap: 15px; width: 340px;
        }
        .pulse-indicator { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; animation: gpsPulse 1.8s infinite ease-in-out; }
        .status-info { flex: 1; }
        .status-info h3 { font-size: 0.95rem; color: #222; margin-bottom: 2px; }
        .status-info p { font-size: 0.8rem; color: #666; }
        @keyframes gpsPulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 168, 62, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(0, 168, 62, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 168, 62, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>BUS510 - VEENDAM LIVE TRACKER</h1>
        <p>ACTIEVE VERSIE: waaris510ab03.html | PROJECT-BUS510-VEENDAM-2026</p>
    </header>

    <div class="app-container">
        <div id="map"></div>
        <div class="status-panel">
            <div class="pulse-indicator" id="status-led" style="background-color: #6c757d;"></div>
            <div class="status-info">
                <h3 id="next-stop">Repo Stream: Gekoppeld</h3>
                <p id="tracker-msg">Wachten op eerste JSON update...</p>
            </div>
        </div>
        <div id="debug-console">
            <div class="debug-entry debug-success">[SYSTEM] waaris510ab03.html geladen. Officiële CDN engine-modus actief.</div>
        </div>
    </div>

    <script>
        function logDebug(msg, isError = false) {
            const consoleEl = document.getElementById('debug-console');
            if (consoleEl) {
                const entry = document.createElement('div');
                entry.className = 'debug-entry' + (isError ? ' debug-error' : '');
                entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                consoleEl.appendChild(entry);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        }

        window.onload = function() {
            logDebug("Engine opgestart in waaris510ab03.html. Initialiseer kaartsysteem...");

            try {
                if (typeof haltesLijn510 === 'undefined') {
                    throw new Error("Bestand 'haltes510.js' ontbreekt in deze map.");
                }
                if (typeof L === 'undefined' || typeof L.map !== 'function') {
                    throw new Error("Volledige Leaflet engine kon niet extern worden ingeladen.");
                }
                logDebug(`Haltes geladen: ${haltesLijn510.length} locaties herkend. Leaflet is OK!`);

                const routePoints = haltesLijn510.map(h => [h.lat, h.lon]);
                
                // Start de echte kaart gecentreerd op Station Veendam
                const map = L.map('map').setView([53.103750, 6.885389], 13);
                logDebug("Echte OpenStreetMap kaart succesvol opgestart.");

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
                
                // Teken de routelijn tussen de haltes
                L.polyline(routePoints, { color: '#005cbf', weight: 5, opacity: 0.75, dashArray: '1, 5' }).addTo(map);

                // Zet kleine blauwe markers op alle haltes
                haltesLijn510.forEach((halte) => { 
                    L.circleMarker([halte.lat, halte.lon], { radius: 5, color: '#005cbf', fillColor: '#fff', fillOpacity: 1 }).addTo(map)
                     .bindPopup(`<b>${halte.naam}</b><br>Doorkomstminuut: .${halte.minuut}`);
                });
                logDebug("Routelijn en markers succesvol op de kaart geplaatst.");

                // Maak de live rode bus marker aan
                const busMarker = L.circleMarker([53.103750, 6.885389], { radius: 11, color: '#fff', fillColor: '#e50000', fillOpacity: 1, weight: 3 }).addTo(map);
                const led = document.getElementById('status-led');

                function fetchLiveGPS() {
                    logDebug("Polled: live-bus.json opvragen...");
                    
                    fetch("live-bus.json", { cache: "no-store" })
                        .then(response => {
                            if (!response.ok) throw new Error("live-bus.json nog niet gegenereerd.");
                            return response.json();
                        })
                        .then(data => {
                            if (data && data.isLive === true) {
                                const liveLat = data.latitude;
                                const liveLon = data.longitude;
                                const speed = data.speed || 0;

                                logDebug(`POS CORRECTION: [${liveLat}, ${liveLon}] | ${speed} km/u`);
                                busMarker.setLatLng([liveLat, liveLon]);
                                
                                led.style.backgroundColor = '#00a83e';
                                document.getElementById('next-stop').innerText = "Stadsbus 510 is Live";
                                document.getElementById('tracker-msg').innerText = `Snelheid: ${speed} km/u | Stream stabiel`;
                            } else {
                                led.style.backgroundColor = '#6c757d';
                                document.getElementById('next-stop').innerText = "Bus momenteel afwezig";
                                document.getElementById('tracker-msg').innerText = data.msg || "Buiten dienstregeling";
                                logDebug("Stream verbinding OK. Status: Geen actieve ritten.");
                            }
                        })
                        .catch(err => {
                            logDebug(`FETCH ERROR: ${err.message}`, true);
                            led.style.backgroundColor = '#dc3545';
                            document.getElementById('next-stop').innerText = "Synchroniseerfout";
                            document.getElementById('tracker-msg').innerText = "Wachten op live-bus.json update...";
                        });
                }

                fetchLiveGPS();
                setInterval(fetchLiveGPS, 15000);

            } catch (globalErr) {
                logDebug(`CRITICAL INIT ERROR: ${globalErr.message}`, true);
            }
        };
    </script>
</body>
</html>
