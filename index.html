<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadsbus Veendam 510 Assistent</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            transition: background-color 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #000;
            text-align: center;
            background-color: #ffffff;
        }
        .container {
            background: rgba(255, 255, 255, 0.92);
            padding: 40px 20px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            width: 85%;
            max-width: 550px;
            box-sizing: border-box;
        }
        h1 { font-size: 2.2rem; margin: 0 0 10px 0; color: #222; }
        .status-text { font-size: 2rem; font-weight: bold; uppercase; margin: 15px 0; }
        .time-diff { font-size: 4.5rem; font-weight: 900; margin: 10px 0; }
        .info-gps { font-size: 1rem; color: #555; margin-top: 20px; }
        button {
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            background-color: #004B87;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container" id="app-box">
    <h1 id="halte-naam">Lijn 510 Veendam</h1>
    <p id="status-tekst">Klik hieronder om de tracking te starten</p>
    <div class="time-diff" id="tijds-verschil">--</div>
    <button id="start-btn" onclick="startBusTracking()">START ROUTE</button>
    <p class="info-gps" id="gps-debug">GPS: Stand-by</p>
</div>

<script>
// Volledige database van Lijn 510 op basis van de aangeleverde dienstregeling
const haltesLijn510 = [

    { naam: "25. Groen van Prinstererlaan", minuut: 15, lat: 53.08845, lon: 6.72185 },
    { naam: "26. Wildervank, Westerhave", minuut: 16, lat: 53.07822, lon: 6.74955 },
    { naam: "27. Wildervank, Zuideinde", minuut: 18, lat: 53.07445, lon: 6.74815 },

    { naam: "44. Bocht Oosterdiep", minuut: 38, lat: 53.10045, lon: 6.75085 }
];

let watchId = null;

function startBusTracking() {
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('halte-naam').innerText = "GPS opstarten...";
    
    if (navigator.geolocation) {
        // Scherm actief houden via de browser Wake Lock API indien ondersteund
        if (navigator.wakeLock) { navigator.wakeLock.request('screen').catch(()=>{}); }
        
        watchId = navigator.geolocation.watchPosition(analyseerLocatie, toonGpsFout, {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        });
    } else {
        alert("Fout: Jouw telefoon ondersteunt geen GPS in de browser.");
    }
}

function analyseerLocatie(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const acc = position.coords.accuracy;
    
    document.getElementById('gps-debug').innerText = `GPS Nauwkeurigheid: ${Math.round(acc)}m`;

    let dichtstbijzijndeHalte = null;
    let minsteAfstand = Infinity;
    
    // Zoek de meest nabije bushalte
    haltesLijn510.forEach(halte => {
        let d = berekenAfstandInMeters(lat, lon, halte.lat, halte.lon);
        if (d < minsteAfstand) {
            minsteAfstand = d;
            dichtstbijzijndeHalte = halte;
        }
    });
    
    // Straal van 75 meter om te bepalen of de bus daadwerkelijk bij de halte staat/rijdt
    if (dichtstbijzijndeHalte && minsteAfstand < 75) {
        evalueerDienstregelingstijd(dichtstbijzijndeHalte);
    } else {
        // Tussen de haltes in kleurt het scherm neutraal wit/grijs
        document.body.style.backgroundColor = "#e0e0e0"; 
        document.getElementById('halte-naam').innerText = "Onderweg...";
        document.getElementById('status-tekst').innerText = "Volgende halte nadert";
        document.getElementById('tijds-verschil').innerText = "---";
    }
}

function evalueerDienstregelingstijd(halte) {
    const nu = new Date();
    const huidigeMinuut = nu.getMinutes();
    
    document.getElementById('halte-naam').innerText = halte.naam;
    
    // Bereken het tijdsverschil in minuten binnen de 60-minutencyclus
    let verschil = huidigeMinuut - halte.minuut;
    if (verschil > 30) verschil -= 60;
    if (verschil < -30) verschil += 60;
    
    if (verschil < 0) {
        // TE VROEG -> ROOD
        document.body.style.backgroundColor = "#ff4d4d"; 
        document.getElementById('status-tekst').innerText = "TE VROEG (WACHTEN)";
        document.getElementById('tijds-verschil').innerText = `${Math.abs(verschil)}m`;
    } else if (verschil <= 2) {
        // OP TIJD (tussen 0 en 2 minuten vertraging) -> GROEN
        document.body.style.backgroundColor = "#2ecc71"; 
        document.getElementById('status-tekst').innerText = "OP TIJD (DOORRIJDEN)";
        document.getElementById('tijds-verschil').innerText = "OK";
    } else {
        // TE LAAT (meer dan 2 minuten vertraging) -> GEEL
        document.body.style.backgroundColor = "#f1c40f"; 
        document.getElementById('status-tekst').innerText = "TE LAAT";
        document.getElementById('tijds-verschil').innerText = `+${verschil}m`;
    }
}

// Haversine formule voor nauwkeurige afstandsberekening in meters
function berekenAfstandInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const phi1 = lat1 * Math.PI/180;
    const phi2 = lat2 * Math.PI/180;
    const deltaPhi = (lat2-lat1) * Math.PI/180;
    const deltaLambda = (lon2-lon1) * Math.PI/180;

    const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
              Math.cos(phi1) * Math.cos(phi2) *
              Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    return R * c;
}

function toonGpsFout(err) {
    document.getElementById('status-tekst').innerText = "GPS signaal verloren of geblokkeerd";
    document.body.style.backgroundColor = "#7f8c8d";
}
</script>
