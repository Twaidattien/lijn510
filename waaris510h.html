<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Buurtbus 510 Tracker - Veendam</title>
    <!-- Leaflet CSS voor de kaart styling via unpkg -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
        }
        header {
            background-color: #ffc107; color: #333; padding: 15px; text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1000;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        #status { font-size: 0.9rem; margin-top: 5px; font-weight: bold; }
        #map { flex-grow: 1; width: 100%; }
        .online { background-color: #1e7e34; color: white; padding: 5px; border-radius: 4px; }
        .offline { background-color: #bd2130; color: white; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>🚌 Live Tracker: Buurtbus 510 Veendam (Versie H)</h1>
        <div id="status">Status: Gegevens ophalen...</div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JavaScript voor de kaart functionaliteit via unpkg -->
    <script src="https://unpkg.com"></script>
    <script>
        // Initialiseer de kaart op Veendam
        var map = L.map('map').setView([53.1017, 6.8742], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(map);

        var busMarker = null;
        var busIcon = L.divIcon({ 
            html: '<span style="font-size: 28px; display: block; text-align: center;">🚌</span>',
            className: 'bus-emoji-icon'
        });

        async function trackBus() {
            var statusEl = document.getElementById('status');
            
            // iPad Tweak: Als er na 5 seconden nog steeds geen antwoord is, dwingen we een melding af
            var timeoutTriggered = false;
            var timeoutTimer = setTimeout(function() {
                timeoutTriggered = true;
                statusEl.innerHTML = "<span class='offline'>⚠️ Verbinding duurt te lang. Controleer adblockers of internet.</span>";
            }, 5000);
            
            try {
                // We gebruiken een alternatieve, snellere CORS proxy die vaak beter werkt op iOS
                var targetUrl = 'https://ovapi.nl';
                var proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
                
                var response = await fetch(proxyUrl);
                clearTimeout(timeoutTimer); // Stop de timer als er wél verbinding is
                
                if (timeoutTriggered) return; // Als de foutbalk al getoond is, doen we niks meer

                if (!response.ok) {
                    statusEl.innerHTML = "<span class='offline'>🔴 OV-data service is momenteel niet bereikbaar.</span>";
                    return;
                }
                
                var data = await response.json();
                var busFound = false;

                for (var lineKey in data) {
                    if (data.hasOwnProperty(lineKey)) {
                        var lineData = data[lineKey];
                        
                        if (lineData.Actuals) {
                            for (var actualKey in lineData.Actuals) {
                                if (lineData.Actuals.hasOwnProperty(actualKey)) {
                                    var actual = lineData.Actuals[actualKey];
                                    
                                    if (actual.Latitude && actual.Longitude) {
                                        var lat = parseFloat(actual.Latitude);
                                        var lng = parseFloat(actual.Longitude);
                                        var bestemming = actual.DestinationName || 'Veendam';

                                        statusEl.innerHTML = "<span class='online'>🟢 Live verbinding! Richting: " + bestemming + "</span>";

                                        if (busMarker) {
                                            busMarker.setLatLng([lat, lng]);
                                        } else {
                                            busMarker = L.marker([lat, lng], { icon: busIcon }).addTo(map);
                                            map.setView([lat, lng], 14);
                                        }

                                        busMarker.bindPopup("<b>Buurtbus 510 (Connexxion)</b><br>Bestemming: " + bestemming + "<br>Laatste update: " + new Date().toLocaleTimeString());
                                        busFound = true;
                                        break;
                                    }
                                }
                            }
                        }
                    }
                    if (busFound) { break; }
                }

                if (!busFound) {
                    statusEl.innerHTML = "<span class='offline'>⏰ De bus is momenteel offline (buiten dienst of pauze).</span>";
                    if (busMarker) {
                        map.removeLayer(busMarker);
                        busMarker = null;
                    }
                }

            } catch (error) {
                clearTimeout(timeoutTimer);
                console.error("Fout bij ophalen OV-data:", error);
                if (!timeoutTriggered) {
                    statusEl.innerHTML = "<span class='offline'>⚠️ Fout bij verbinden met de live data-feed.</span>";
                }
            }
        }

        // Start direct en ververs elke 15 seconden
        trackBus();
        setInterval(trackBus, 15000);
    </script>
</body>
</html>
