<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT-BUS510-VEENDAM-2026 - Live Tracker (Versie Z16)</title>
    <!-- We linken nu puur naar uw eigen lokale css-bestand -->
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { background-color: #f0f4f8; display: flex; flex-direction: column; }
        
        header { 
            background-color: #005cbf; color: white; padding: 15px; text-align: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: relative; z-index: 1000;
        }
        header h1 { font-size: 1.4rem; letter-spacing: 0.5px; }
        header p { font-size: 0.85rem; opacity: 0.85; margin-top: 3px; }

        .app-container { flex: 1; position: relative; width: 100%; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; z-index: 1; background-color: #e5e5e5; min-height: 40vh; }

        #debug-console {
            background-color: #1e1e1e; color: #00ff00; font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem; padding: 15px; height: 160px; overflow-y: auto;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); border-top: 3px solid #dc3545; z-index: 2000;
        }
        .debug-entry { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 3px; }
        .debug-error { color: #ff3333; font-weight: bold; }
        .debug-success { color: #33ff33; }

        .status-panel {
            position: absolute; top: 20px; left: 20px; background: white; padding: 15px 20px; 
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 2000;
            display: flex; align-items: center; gap: 15px; width: 340px;
        }
        .pulse-indicator { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; animation: gpsPulse 1.8s infinite ease-in-out; }
        .status-info { flex: 1; }
        .status-info h3 { font-size: 0.95rem; color: #222; margin-bottom: 2px; }
        .status-info p { font-size: 0.8rem; color: #666; }
        @keyframes gpsPulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 168, 62, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(0, 168, 62, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 168, 62, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>BUS510 - VEENDAM LIVE TRACKER (Versie Z16)</h1>
        <p>PROJECT-BUS510-VEENDAM-2026 | Lokale Sandboxed Gateway Modus</p>
    </header>

    <div class="app-container">
        <div id="map"></div>
        <div class="status-panel">
            <div class="pulse-indicator" id="status-led" style="background-color: #6c757d;"></div>
            <div class="status-info">
                <h3 id="next-stop">Volgende halte: Berekenen...</h3>
                <p id="tracker-msg">Live GPS-simulatie actief</p>
            </div>
        </div>
        <div id="debug-console">
            <div class="debug-entry debug-success">[SYSTEM] Foutopsporingspaneel Versie Z16 actief. Lokale imports laden...</div>
        </div>
    </div>

    <!-- We laden nu uw eigen lokale javascript-bestand in -->
    <script src="leaflet.js"></script>
    <!-- Externe haltelijst databron koppelen -->
    <script src="haltes510.js"></script>
    <script>
        function logDebug(msg, isError = false) {
            const consoleEl = document.getElementById('debug-console');
            if (consoleEl) {
                const entry = document.createElement('div');
                entry.className = 'debug-entry' + (isError ? ' debug-error' : '');
                const timestamp = new Date().toLocaleTimeString();
                entry.innerText = `[${timestamp}] ${msg}`;
                consoleEl.appendChild(entry);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        }

        window.onerror = function(message, source, lineno, colno, error) {
            logDebug(`CRASH IN SCRIPT: ${message} op regel ${lineno}`, true);
            return false;
        };

        // Wacht tot de pagina geladen is en controleer continu of de engine al is overgedragen
        window.onload = function() {
            logDebug("window.onload geactiveerd. Wachten op lokale kaart-engine gateway...");

            let checkCount = 0;
            const checkEngine = setInterval(function() {
                checkCount++;
                
                if (typeof L !== 'undefined' && typeof L.map === 'function') {
                    clearInterval(checkEngine);
                    logDebug(`Kaart-engine succesvol gedetecteerd na ${checkCount * 100}ms. Starten applicatie...`);
                    initTracker();
                } else if (checkCount > 50) { // Na 5 seconden time-out
                    clearInterval(checkEngine);
                    logDebug("INITIALISATIEFOUT: Lokale gateway weigert de kaart-engine vrij te geven.", true);
                }
            }, 100);

            function initTracker() {
                try {
                    if (typeof haltesLijn510 === 'undefined') {
                        throw new Error("Bestand 'haltes510.js' is niet correct geladen of mist in de map.");
                    }
                    logDebug(`Database 'haltes510.js' succesvol uitgelezen. Aantal haltes: ${haltesLijn510.length}`);

                    const routePoints = haltesLijn510.map(h => [h.lat, h.lon]);
                    
                    const map = L.map('map').setView([53.0970, 6.8700], 13);
                    logDebug("Kaart succesvol opgebouwd.");

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap-auteurs',
                        maxZoom: 18
                    }).addTo(map);
                    logDebug("Kaarttegels succesvol gekoppeld.");

                    L.polyline(routePoints, { color: '#005cbf', weight: 5, opacity: 0.75, dashArray: '1, 5' }).addTo(map);
                    logDebug("Routelijn op kaart getekend.");

                    haltesLijn510.forEach((halte) => {
                        L.circleMarker([halte.lat, halte.lon], {
                            radius: 5, color: '#005cbf', fillColor: '#fff', fillOpacity: 1, weight: 2
                        }).addTo(map).bindPopup(`<b>Halte:</b> ${halte.naam}`);
                    });
                    logDebug("Alle halte-markers succesvol geplaatst.");

                    // Dienstregeling-tijdscontrole (Donderdagmiddag = Actief)
                    const nu = new Date();
                    const day = nu.getDay(); 
                    const hours = nu.getHours();
                    const minutes = nu.getMinutes();
                    const tijdInMinuten = (hours * 60) + minutes;

                    let rijdtNu = false;
                    if (day === 1) { 
                        rijdtNu = (tijdInMinuten >= 760 && tijdInMinuten <= 978);
                    } else if (day >= 2 && day <= 6) { 
                        rijdtNu = (tijdInMinuten >= 642 && tijdInMinuten <= 978);
                    }
                    logDebug(`Tijdscontrole voltooid. Actieve uren status: ${rijdtNu}`);

                    const led = document.getElementById('status-led');
                    
                    const busMarker = L.circleMarker(routePoints[0], {
                        radius: 11, color: '#fff', fillColor: '#e50000', fillOpacity: 1, weight: 3
                    }).bindPopup("<b>Buurtbus 510</b>");

                    let currentLeg = 0;
                    let progress = 0;
                    const stepsPerLeg = 100; 

                    if (rijdtNu) {
                        busMarker.addTo(map);
                        led.style.backgroundColor = '#00a83e';
                        logDebug("Bus-marker opgestart. Activeren motor-lus...");
                        
                        // Start tracking-functie binnen het try-catch blok
                        (function updateBusTracking() {
                            try {
                                let start = routePoints[currentLeg];
                                let end = routePoints[(currentLeg + 1) % routePoints.length];

                                let lat = start[0] + (end[0] - start[0]) * (progress / stepsPerLeg);
                                let lng = start[1] + (end[1] - start[1]) * (progress / stepsPerLeg);
                                
                                busMarker.setLatLng([lat, lng]);

                                let nextHalte = haltesLijn510[(currentLeg + 1) % haltesLijn510.length];
                                document.getElementById('next-stop').innerText = `Volgende halte: ${nextHalte.naam}`;

                                progress++;
                                if (progress > stepsPerLeg) {
                                    progress = 0;
                                    currentLeg = (currentLeg + 1) % routePoints.length;
                                }

                                setTimeout(updateBusTracking, 50);
                            } catch (innerErr) {
                                logDebug(`Fout in simulatie: ${innerErr.message}`, true);
                            }
                        })();
                        
                    } else {
                        led.style.backgroundColor = '#6c757d';
                        document.getElementById('next-stop').innerText = "Bus buiten dienst";
                        document.getElementById('tracker-msg').innerText = "Buiten de actuele dienstregeling";
                        logDebug("Bus staat gepland buiten actieve uren.");
                    }

                } catch (globalErr) {
                    logDebug(`INITIALISATIEFOUT: ${globalErr.message}`, true);
                }
            }
        };
    </script>
</body>
</html>
