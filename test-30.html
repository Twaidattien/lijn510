<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadsbus Veendam 510 Assistent</title>
    <!-- Icoontje voor het iPhone startscherm -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Icoontje voor het Android-telefoons -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://icons8.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            transition: background-color 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #000;
            text-align: center;
            background-color: #ffffff;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255, 255, 255, 0.92);
            padding: 40px 20px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            width: 90%;
            max-width: 550px;
            box-sizing: border-box;
        }
        h1 { font-size: 2.2rem; margin: 0 0 10px 0; color: #222; }
        .status-text { font-size: 2rem; font-weight: bold; text-transform: uppercase; margin: 15px 0; }
        .time-diff { font-size: 4.5rem; font-weight: 900; margin: 10px 0; }
        .info-gps { font-size: 1rem; color: #555; margin-top: 20px; }
        
        .select-start-halte {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 2px solid #ccc;
            margin-bottom: 20px;
            background-color: #fff;
            box-sizing: border-box;
        }
        
        button {
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            background-color: #004B87;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:active { transform: scale(0.98); }
        .test-btn {
            padding: 5px 12px;
            font-size: 0.9rem;
            background-color: #444;
            color: #fff;
            border-radius: 4px;
            margin-left: 5px;
            cursor: pointer;
        }

        #debug-venster {
            background: #222;
            color: #00ff00;
            font-family: monospace;
            text-align: left;
            padding: 15px;
            margin: 20px auto;
            width: 90%;
            max-width: 550px;
            border-radius: 12px;
            box-sizing: border-box;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }
        #debug-venster div {
            margin-bottom: 5px;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container" id="app-box">
    <div id="actuele-tijd" style="font-size: 3.0rem; font-weight: 900; color: #000000; margin-bottom: 15px;">--:--</div>
    <h1 id="halte-naam">Lijn 510 Veendam</h1>
    <p id="status-tekst">Kies je starthalte en start de route</p>
    
    <select id="start-halte-select" class="select-start-halte">
        <!-- Wordt gevuld door JavaScript -->
    </select>

    <div class="time-diff" id="tijds-verschil">--</div>
    <button id="start-btn" onclick="startBusTracking()">START ROUTE</button>
    <p class="info-gps" id="gps-debug">GPS: Stand-by</p>
</div>

<div id="debug-venster">
    <h3>Live Code Monitor</h3>
    <div><b>Doelhalte:</b> <span id="debug-stop-name">-</span></div>
    <div><b>Afstand:</b> <span id="debug-stop-dist">-</span></div>
    <div style="margin-top: 10px;">
        <b>Handmatig skippen:</b>
        <button class="test-btn" onclick="handmatigeHalteWissel(-1)">◀ Vorige</button>
        <button class="test-btn" onclick="handmatigeHalteWissel(1)">Volgende ▶</button>
    </div>
</div>

<script>
const haltesLijn510 = [
    { naam: "1. Station Veendam (Vertrek)", minuut: 42, lat: 53.103750, lon: 6.885389 },
    { naam: "2. Jakob Bruggemalaan (Heen)", minuut: 45, lat: 53.110548, lon: 6.886444 },
    { naam: "3. Beneden Oosterdiep", minuut: 46, lat: 53.114273, lon: 6.887702 },
    { naam: "4. Nassaustraat", minuut: 47, lat: 53.115265, lon: 6.883968 },
    { naam: "5. Meridiaan", minuut: 48, lat: 53.114705, lon: 6.883013 },
    { naam: "6. Oranjeborgh", minuut: 50, lat: 53.112971, lon: 6.882369 },
    { naam: "7. Voormolenstraat", minuut: 51, lat: 53.112327, lon: 6.885490 },
    { naam: "8. Jakob Bruggemalaan (Centr.)", minuut: 52, lat: 53.109674, lon: 6.885534 },
    { naam: "9. van Beresteijnstraat", minuut: 53, lat: 53.106042, lon: 6.881161 },
    { naam: "10. Parkeerterrein Promenade", minuut: 55, lat: 53.106213, lon: 6.878956 },
    { naam: "11. Hertenkampstraat", minuut: 57, lat: 53.107805, lon: 6.8765188 },
    { naam: "12. R.H. van Deestweg", minuut: 58, lat: 53.107160, lon: 6.871254 },
    { naam: "13. Zilverlaan", minuut: 0, lat: 53.107577, lon: 6.869766 },
    { naam: "14. Steenstraat", minuut: 1, lat: 53.106727, lon: 6.868893 },
    { naam: "15. Parkflat", minuut: 2, lat: 53.105448, lon: 6.865948 },
    { naam: "16. Zeilstraat (Heen)", minuut: 3, lat: 53.103832, lon: 6.861367 },
    { naam: "17. Oostlaan (Heen)", minuut: 4, lat: 53.103218, lon: 6.859072 },
    { naam: "18. Finse Golf (Heen)", minuut: 6, lat: 53.099909, lon: 6.859479 },
    { naam: "19. Skagerrak (Heen)", minuut: 8, lat: 53.096740, lon: 6.858971 },
    { naam: "20. WC Skagerrak (Heen)", minuut: 10, lat: 53.095871, lon: 6.860390 },
    { naam: "21. Eems", minuut: 11, lat: 53.094080, lon: 6.856033 },
    { naam: "22. Gelrelaan", minuut: 12, lat: 53.090887, lon: 6.854126 },
    { naam: "23. Rietgors", minuut: 13, lat: 53.083053, lon: 6.849812 },
    { naam: "24. Langebosschedijk", minuut: 14, lat: 53.0883576, lon: 6.854113 },
    { naam: "25. Groen van Prinstererlaan", minuut: 15, lat: 53.084480, lon: 6.860535 },
    { naam: "26. Westerhave", minuut: 16, lat: 53.082164, lon: 6.859129 },
    { naam: "26a. Bijleveldcentrum", minuut: 17, lat: 53.081852, lon: 6.862959 },
    { naam: "27. Zuideinde", minuut: 18, lat: 53.083897, lon: 6.864186 },
    { naam: "28. Apollolaan", minuut: 18, lat: 53.085261, lon: 6.865775 },
    { naam: "29. 5e Laan", minuut: 19, lat: 53.090063, lon: 6.869582 },
    { naam: "30. Nijverheidsstraat", minuut: 20, lat: 53.094151, lon: 6.872132 },
    { naam: "31. Sint Franciscus", minuut: 21, lat: 53.097836, lon: 6.872422 },
    { naam: "32. De Breehorn 1", minuut: 22, lat: 53.099085, lon: 6.870248 },
    { naam: "32a. De Breehorn 2", minuut: 23, lat: 53.098315, lon: 6.868664 },
    { naam: "33. Lubecker Bocht", minuut: 24, lat: 53.096641, lon: 6.866848 },
    { naam: "34. WC Skagerrak (Terug)", minuut: 25, lat: 53.095871, lon: 6.860390 },
    { naam: "35. Skagerrak (Terug)", minuut: 27, lat: 53.096987, lon: 6.859315 },
    { naam: "36. Finse Golf (Terug)", minuut: 28, lat: 53.099263, lon: 6.859684 },
    { naam: "37. Oostlaan (Terug)", minuut: 30, lat: 53.1027222, lon: 6.8597222 },
    { naam: "38. Zeilstraat (Terug)", minuut: 32, lat: 53.103801, lon: 6.862360 },
    { naam: "39. Zwembad", minuut: 33, lat: 53.105384, lon: 6.867356 },
    { naam: "40. Kazemierstraat", minuut: 33, lat: 53.105209, lon: 6.871542 },
    { naam: "41. Lidl en Poiesz", minuut: 34, lat: 53.105327, lon: 6.874180 },
    { naam: "42. Kerkplein", minuut: 35, lat: 53.105908, lon: 6.875570 },
    { naam: "43. Raadhuisplein 5", minuut: 36, lat: 53.104217, lon: 6.877558 },
    { naam: "44. Bocht Oosterdiep", minuut: 38, lat: 53.104468, lon: 6.880000 }
];

let watchId = null;
let huidigeHalteIndex = 0;
// Schakelaar om te onthouden of de bus momenteel bij de halte staat
let isBijHalte = false; 

window.onload = function() {
    // Start de timer die om de 10 seconden de klok én de stiptheid verversst
    setInterval(updateKlokEnStiptheid, 10000);
    vulDropdownMenu();
};

function updateKlokEnStiptheid() {
    const nu = new Date();
    const uren = String(nu.getHours()).padStart(2, '0');
    const minuten = String(nu.getMinutes()).padStart(2, '0');
    document.getElementById('actuele-tijd').innerText = `${uren}:${minuten}`;

    const startBtn = document.getElementById('start-btn');
    if (startBtn && startBtn.style.display === 'none') {
        const doelHalte = haltesLijn510[huidigeHalteIndex];
        berekenStiptheid(doelHalte.minuut);
    }
}

function vulDropdownMenu() {
    const selectEl = document.getElementById('start-halte-select');
    haltesLijn510.forEach((halte, index) => {
        const optie = document.createElement('option');
        optie.value = index;
        optie.innerText = halte.naam;
        selectEl.appendChild(optie);
    });
}

function startBusTracking() {
    const selectEl = document.getElementById('start-halte-select');
    huidigeHalteIndex = parseInt(selectEl.value);

    document.getElementById('start-btn').style.display = 'none';
    selectEl.style.display = 'none';
    document.getElementById('halte-naam').innerText = "GPS opstarten...";
    
    if (navigator.geolocation) {
        if (navigator.wakeLock) { navigator.wakeLock.request('screen').catch(()=>{}); }
        
        watchId = navigator.geolocation.watchPosition(analyseerLocatie, toonGpsFout, {
            enableHighAccuracy: true,
            maximumAge: 0, 
            timeout: 5000
        });
        
        const doelHalte = haltesLijn510[huidigeHalteIndex];
        berekenStiptheid(doelHalte.minuut);
        document.getElementById('halte-naam').innerText = doelHalte.naam;
    } else {
        alert("Fout: Jouw telefoon ondersteunt geen GPS.");
    }
}

function analyseerLocatie(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const acc = position.coords.accuracy;
    
    document.getElementById('gps-debug').innerText = `GPS: ${Math.round(acc)}m`;

    // TIJDELIJKE OMLEIDING: Als de app op de een of andere manier op index 43 (Halte 43) terechtkomt,
    // dwingen we hem direct door naar index 44 (Halte 44).
    if (huidigeHalteIndex === 43) {
        huidigeHalteIndex = 44;
    }

    const doelHalte = haltesLijn510[huidigeHalteIndex];
    const afstand = berekenAfstand(lat, lon, doelHalte.lat, doelHalte.lon);
    
    document.getElementById('debug-stop-name').innerText = doelHalte.naam;
    document.getElementById('debug-stop-dist').innerText = `${Math.round(afstand)}m`;
    document.getElementById('halte-naam').innerText = doelHalte.naam;

    berekenStiptheid(doelHalte.minuut);

    // STAP 1: Als de bus binnen 55 meter komt, activeren we de halte-modus
    if (afstand <= 55 && acc < 40) {
        isBijHalte = true; 
    }

    // STAP 2: Pas als de bus er weer vandaan rijdt (afstand > 55m) ÉN we stonden er daadwerkelijk
    if (afstand > 55 && isBijHalte === true && acc < 40) {
        isBijHalte = false; // Reset de schakelaar voor de volgende halte
        
        // Als we vertrekken bij Halte 42 (index 42), springen we direct naar Halte 44 (index 44)
        if (huidigeHalteIndex === 42) {
            huidigeHalteIndex = 44; 
        } else {
            huidigeHalteIndex = (huidigeHalteIndex + 1) % haltesLijn510.length;
        }
        
        const volgende = haltesLijn510[huidigeHalteIndex];
        document.getElementById('debug-stop-name').innerText = penultimate = volgende.naam;
        berekenStiptheid(volgende.minuut);
    }
}


function berekenStiptheid(geplandeMinuut) {
    const nu = new Date();
    const huidigeMinuut = nu.getMinutes();
    let verschil = huidigeMinuut - geplandeMinuut;
    
    if (verschil < -30) verschil += 60;
    if (verschil > 30) verschil -= 60;

    const statusTekstEl = document.getElementById('status-tekst');
    const verschilEl = document.getElementById('tijds-verschil');
    const boxEl = document.getElementById('app-box');

    if (verschil < 0) {
        statusTekstEl.innerText = "TE VROEG";
        verschilEl.innerText = `-${Math.abs(verschil)}`;
        boxEl.style.backgroundColor = "#ff0000"; // Rood = WACHTEN
    } else if (verschil >= 0 && verschil <= 2) {
        statusTekstEl.innerText = "OP TIJD";
        verschilEl.innerText = verschil > 0 ? `+${verschil}` : "0";
        boxEl.style.backgroundColor = "#00ff00"; // Groen = VERTREKKEN
    } else {
        statusTekstEl.innerText = "TE LAAT";
        verschilEl.innerText = `+${verschil}`;
        boxEl.style.backgroundColor = "#ffff00"; // Geel = VERTREKKEN (vertraging)
    }
}

function berekenAfstand(lat1, lon1, lat2, lon2) {
    const R = 6371e3; 
    const phi1 = lat1 * Math.PI / 180;
    const phi2 = lat2 * Math.PI / 180;
    const deltaPhi = (lat2 - lat1) * Math.PI / 180;
    const deltaLambda = (lon2 - lon1) * Math.PI / 180;

    const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
              Math.cos(phi1) * Math.cos(phi2) *
              Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c; 
}

function handmatigeHalteWissel(richting) {
    huidigeHalteIndex = huidigeHalteIndex + richting;
    isBijHalte = false; // Reset de schakelaar bij handmatig skippen
    
    if (huidigeHalteIndex < 0) {
        huidigeHalteIndex = haltesLijn510.length - 1;
    }
    if (huidigeHalteIndex >= haltesLijn510.length) {
        huidigeHalteIndex = 0;
    }
    
    const target = haltesLijn510[huidigeHalteIndex];
    document.getElementById('debug-stop-name').innerText = target.naam;
    document.getElementById('halte-naam').innerText = target.naam;
    berekenStiptheid(target.minuut);
}

function toonGpsFout(error) {
    document.getElementById('gps-debug').innerText = `GPS Fout: ${error.message}`;
}
</script>
</body>
</html>
