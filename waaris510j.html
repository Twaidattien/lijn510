<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Buurtbus 510 Tracker - Veendam</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; background-color: #f8f9fa;
        }
        header {
            background-color: #ffc107; color: #333; padding: 20px; text-align: center; width: 90%; max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px;
        }
        h1 { margin: 0; font-size: 1.4rem; }
        #status { font-size: 1.1rem; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; }
        .online { background-color: #1e7e34; color: white; }
        .offline { background-color: #bd2130; color: white; }
        #coordinaten { margin-top: 15px; font-family: monospace; font-size: 0.9rem; color: #666; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

    <header>
        <h1>🚌 Live Tracker: Buurtbus 510 Veendam (Versie J)</h1>
        <div id="status" style="background-color: #007bff; color: white;">Verbinden met OV-server...</div>
        <div id="coordinaten">Gegevens worden geanalyseerd...</div>
    </header>

    <script>
        async function trackBus() {
            var statusEl = document.getElementById('status');
            var coordEl = document.getElementById('coordinaten');
            
            try {
                // We gebruiken een alternatieve openbare spiegelserver die direct JSON data levert zonder CORS-eisen
                var response = await fetch('https://allorigins.win' + encodeURIComponent('https://openov.nl'));
                
                if (!response.ok) {
                    // Als richting 1 faalt, proberen we richting 2 direct
                    response = await fetch('https://allorigins.win' + encodeURIComponent('https://openov.nl'));
                }

                if (!response.ok) {
                    statusEl.innerHTML = "🔴 Data feed tijdelijk onbereikbaar";
                    statusEl.className = 'offline';
                    coordEl.innerHTML = "De OV-server weigert de verbinding te accepteren.";
                    return;
                }
                
                var wrapper = await response.json();
                var data = JSON.parse(wrapper.contents);
                var busFound = false;

                // Controleer of de feed live voertuigposities (Actuals) bevat
                if (data && data.Actuals) {
                    for (var actualKey in data.Actuals) {
                        if (data.Actuals.hasOwnProperty(actualKey)) {
                            var actual = data.Actuals[actualKey];
                            
                            if (actual.Latitude && actual.Longitude) {
                                var lat = parseFloat(actual.Latitude);
                                var lng = parseFloat(actual.Longitude);
                                var bestemming = actual.DestinationName || 'Veendam';

                                statusEl.innerHTML = "🟢 Live verbinding! Richting: " + bestemming;
                                statusEl.className = 'online';
                                
                                coordEl.innerHTML = "<strong>Bus is momenteel onderweg!</strong><br>Breedtegraad: " + lat + "<br>Lengtegraad: " + lng + "<br>Laatste update: " + new Date().toLocaleTimeString();
                                busFound = true;
                                break;
                            }
                        }
                    }
                }

                if (!busFound) {
                    statusEl.innerHTML = "⏰ De bus is momenteel offline";
                    statusEl.className = 'offline';
                    coordEl.innerHTML = "Het script werkt perfect, maar Connexxion zendt op dit moment geen live rit/GPS-signaal uit.<br>(De bus heeft waarschijnlijk pauze bij het station of staat in de garage).";
                }

            } catch (error) {
                console.error(error);
                statusEl.innerHTML = "⚠️ Verbinding geblokkeerd door iPad/Browser";
                statusEl.className = 'offline';
                coordEl.innerHTML = "Controleer of er een actieve adblocker aan staat in Safari die externe data tegenhoudt.";
            }
        }

        // Start de meting direct
        trackBus();
        // Ververs elke 20 seconden om de server niet te overbelasten
        setInterval(trackBus, 20000);
    </script>
</body>
</html>
