<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Buurtbus 510 Tracker - Veendam</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; background-color: #f8f9fa;
        }
        header {
            background-color: #ffc107; color: #333; padding: 20px; text-align: center; width: 90%; max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px;
        }
        h1 { margin: 0; font-size: 1.4rem; }
        #status { font-size: 1.1rem; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; }
        .online { background-color: #1e7e34; color: white; }
        .offline { background-color: #bd2130; color: white; }
        #coordinaten { margin-top: 15px; font-family: monospace; font-size: 0.9rem; color: #666; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

    <header>
        <h1>🚌 Live Tracker: Buurtbus 510 Veendam (Versie L)</h1>
        <div id="status" style="background-color: #007bff; color: white;">Echte live data inladen...</div>
        <div id="coordinaten">Verbinding maken met OpenOV via veilige script-route...</div>
    </header>

    <script>
        // Deze functie wordt automatisch aangeroepen zodra de live OV-data binnenkomt via de script-tag
        function verwerkLiveBusData(data) {
            var statusEl = document.getElementById('status');
            var coordEl = document.getElementById('coordinaten');
            var busFound = false;

            try {
                // Loop door de data heen om te zoeken naar een actieve Connexxion bus met GPS
                for (var lineKey in data) {
                    if (data.hasOwnProperty(lineKey)) {
                        var lineData = data[lineKey];
                        
                        if (lineData.Actuals) {
                            for (var actualKey in lineData.Actuals) {
                                if (lineData.Actuals.hasOwnProperty(actualKey)) {
                                    var actual = lineData.Actuals[actualKey];
                                    
                                    if (actual.Latitude && actual.Longitude) {
                                        var lat = parseFloat(actual.Latitude);
                                        var lng = parseFloat(actual.Longitude);
                                        var bestemming = actual.DestinationName || 'Veendam';

                                        statusEl.innerHTML = "🟢 ECHTE LIVE VERBINDING! Richting: " + bestemming;
                                        statusEl.className = 'online';
                                        
                                        coordEl.innerHTML = "<strong>Bus rijdt nu echt!</strong><br>Breedtegraad: " + lat + "<br>Lengtegraad: " + lng + "<br>Laatste update: " + new Date().toLocaleTimeString();
                                        busFound = true;
                                        break;
                                    }
                                }
                            }
                        }
                    }
                    if (busFound) { break; }
                }

                if (!busFound) {
                    statusEl.innerHTML = "⏰ De bus is momenteel offline";
                    statusEl.className = 'offline';
                    coordEl.innerHTML = "De verbinding werkt perfect, maar Connexxion zendt op dit moment geen live GPS-signaal uit.<br>(Het is nu lunchtijd/pauze of de bus staat stil bij het station).";
                }

            } catch (error) {
                statusEl.innerHTML = "⚠️ Fout bij verwerken data";
                statusEl.className = 'offline';
            }
        }
    </script>

    <!-- 
      iPad bypass: We laden de live data in als een extern javascript-bestand met een 'callback'.
      Safari accepteert dit altijd omdat het technisch gezien geen los netwerkverzoek (fetch) is!
    -->
    <script src="https://ovapi.nl"></script>

</body>
</html>
