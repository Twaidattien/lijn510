<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUS510 - VEENDAM Tracker</title>
    <!-- Leaflet CSS voor de interactieve kaart -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #005cbf;
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Container voor de kaart en de info */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Live status paneel overlay */
        .status-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
            width: 90%;
            max-width: 450px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #28a745;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .status-info {
            flex: 1;
        }

        .status-info h3 {
            font-size: 1rem;
            color: #333;
        }

        .status-info p {
            font-size: 0.85rem;
            color: #666;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(40, 167, 69, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        /* Schaalbaarheid voor desktop */
        @media (min-width: 768px) {
            .status-panel {
                bottom: unset;
                top: 20px;
                left: 20px;
                transform: none;
                width: 320px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>BUS510 - VEENDAM LIVE</h1>
        <p>Realtime Locatietracking Stadsbus Veendam 2026</p>
    </header>

    <div class="app-container">
        <!-- De kaart -->
        <div id="map"></div>

        <!-- Status Paneel -->
        <div class="status-panel">
            <div class="status-dot"></div>
            <div class="status-info">
                <h3 id="current-stop">Volgende halte: Laden...</h3>
                <p id="bus-status">Bus rijdt momenteel op de route.</p>
            </div>
        </div>
    </div>

    <!-- Leaflet JS voor kaartfunctionaliteit -->
    <script src="https://unpkg.com"></script>
    <script>
        // Coördinaten van de route van Bus 510 in Veendam (simulatie-route)
        const routeCoords = [
            [53.1012, 6.7534], // Station Veendam
            [53.1025, 6.7505], // Julianapark
            [53.1041, 6.7482], // Centrum / Kerkplein
            [53.1070, 6.7495], // Boven Oosterdiep
            [53.1115, 6.7540], // Sorghvliet Noord
            [53.1090, 6.7620], // Skagerrak
            [53.1035, 6.7650], // Langeleegte
            [53.1012, 6.7534]  // Terug naar Station
        ];

        const haltes = [
            { name: "Veendam Station", coord: [53.1012, 6.7534] },
            { name: "Julianapark", coord: [53.1025, 6.7505] },
            { name: "Veendam Centrum", coord: [53.1041, 6.7482] },
            { name: "Boven Oosterdiep", coord: [53.1070, 6.7495] },
            { name: "Sorghvliet", coord: [53.1115, 6.7540] },
            { name: "Skagerrak", coord: [53.1090, 6.7620] },
            { name: "Langeleegte", coord: [53.1035, 6.7650] }
        ];

        // 1. Initialiseer de kaart gecentreerd op Veendam
        const map = L.map('map').setView([53.1045, 6.7545], 14);

        // 2. Voeg een mooie, privacy-vriendelijke kaartlaag toe (werkt overal)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Teken de buslijn op de kaart
        const polyline = L.polyline(routeCoords, { color: '#005cbf', weight: 5, opacity: 0.7 }).addTo(map);

        // 4. Plaats markers bij de officiële haltes
        haltes.forEach(halte => {
            L.circleMarker(halte.coord, {
                radius: 6,
                color: '#fff',
                fillColor: '#005cbf',
                fillOpacity: 1,
                weight: 2
            }).addTo(map).bindPopup(`<b>Halte:</b> ${halte.name}`);
        });

        // 5. Maak de live bus marker (een opvallende rode cirkel/icon)
        const busMarker = L.circleMarker(routeCoords[0], {
            radius: 10,
            color: '#fff',
            fillColor: '#dc3545',
            fillOpacity: 1,
            weight: 3
        }).addTo(map).bindPopup("<b>Stadsbus 510</b><br>Live Positie");

        // 6. Animatie-logica om de live tracker soepel te simuleren
        let step = 0;
        let routeIndex = 0;
        const interpolationSteps = 100; // Hoeveel stapjes tussen twee punten voor soepel verloop

        function moveBus() {
            let startCoord = routeCoords[routeIndex];
            let endCoord = routeCoords[(routeIndex + 1) % routeCoords.length];

            // Bereken tussenliggende positie
            let lat = startCoord[0] + (endCoord[0] - startCoord[0]) * (step / interpolationSteps);
            let lng = startCoord[1] + (endCoord[1] - startCoord[1]) * (step / interpolationSteps);
            
            const newPos = [lat, lng];
            busMarker.setLatLng(newPos);

            // Update statuspaneel op basis van de dichtstbijzijnde halte
            let nextHalte = haltes[(routeIndex + 1) % haltes.length];
            document.getElementById('current-stop').innerText = `Volgende halte: ${nextHalte.name}`;

            step++;
            if (step > interpolationSteps) {
                step = 0;
                routeIndex = (routeIndex + 1) % routeCoords.length;
            }

            setTimeout(moveBus, 50); // Snelheid van de simulatie updates
        }

        // Start het live tracken
        moveBus();
    </script>
</body>
</html>
