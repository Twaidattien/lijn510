<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>waaris510aa06.html - Live Tracker</title>
    
    <!-- Leaflet CSS én JavaScript nu bovenin de HEAD geplaatst zodat 'L' altijd direct gedefinieerd is -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { background-color: #f0f4f8; display: flex; flex-direction: column; }
        
        header { 
            background-color: #005cbf; color: white; padding: 15px; text-align: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: relative; z-index: 1000;
        }
        header h1 { font-size: 1.4rem; letter-spacing: 0.5px; }
        header p { font-size: 0.85rem; opacity: 0.85; margin-top: 3px; }

        .app-container { flex: 1; position: relative; width: 100%; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; z-index: 1; min-height: 40vh; }

        #debug-console {
            background-color: #1e1e1e; color: #00ff00; font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem; padding: 15px; height: 160px; overflow-y: auto;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); border-top: 3px solid #dc3545; z-index: 2000;
        }
        .debug-entry { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 3px; }
        .debug-error { color: #ff3333; font-weight: bold; }
        .debug-success { color: #33ff33; }

        .status-panel {
            position: absolute; top: 20px; left: 20px; background: white; padding: 15px 20px; 
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 2000;
            display: flex; align-items: center; gap: 15px; width: 340px;
        }
        .pulse-indicator { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; animation: gpsPulse 1.8s infinite ease-in-out; }
        .status-info { flex: 1; }
        .status-info h3 { font-size: 0.95rem; color: #222; margin-bottom: 2px; }
        .status-info p { font-size: 0.8rem; color: #666; }
        @keyframes gpsPulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 168, 62, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(0, 168, 62, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 168, 62, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>BUS510 - VEENDAM LIVE TRACKER</h1>
        <p>BESTAND: waaris510aa06.html | PROJECT-BUS510-VEENDAM-2026</p>
    </header>

    <div class="app-container">
        <div id="map"></div>
        <div class="status-panel">
            <div class="pulse-indicator" id="status-led" style="background-color: #6c757d;"></div>
            <div class="status-info">
                <h3 id="next-stop">Live GPS: Zoeken naar voertuig...</h3>
                <p id="tracker-msg">Verbinden met openbare OV-datastream...</p>
            </div>
        </div>
        <div id="debug-console">
            <div class="debug-entry debug-success">[SYSTEM] waaris510aa06.html succesvol geladen. Wachten op script-initialisatie...</div>
        </div>
    </div>
    <script>
        function logDebug(msg, isError = false) {
            const consoleEl = document.getElementById('debug-console');
            if (consoleEl) {
                const entry = document.createElement('div');
                entry.className = 'debug-entry' + (isError ? ' debug-error' : '');
                entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                consoleEl.appendChild(entry);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        }

        window.onload = function() {
            logDebug("window.onload geactiveerd in waaris510aa05.html. Starten proxy engine...");

            try {
                if (typeof haltesLijn510 === 'undefined') {
                    throw new Error("Bestand 'haltes510.js' kon nu niet in dezelfde map worden gevonden.");
                }
                logDebug(`Database succesvol geladen. ${haltesLijn510.length} haltes paraat.`);

                // Zet de haltes om naar bruikbare punten voor de route-stippellijn
                const routePoints = haltesLijn510.map(h => [h.lat, h.lon]);
                
                // Initialiseer de echte Leaflet kaart gecentreerd op Veendam Station
                const map = L.map('map', { 
                    center: [53.103750, 6.885389], 
                    zoom: 14,
                    zoomControl: true 
                });
                logDebug("Kaartomgeving succesvol geïnitialiseerd via Leaflet CDN.");

                // Laad de officiële universele OpenStreetMap-kaarttegels in
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>-bijdragers'
                }).addTo(map);

                // Teken de busroute als een blauwe stippellijn over de weg
                L.polyline(routePoints, { 
                    color: '#005cbf', 
                    weight: 5, 
                    opacity: 0.85, 
                    dashArray: '5, 10' 
                }).addTo(map);

                // Teken alle haltes als WITTE stippen met een duidelijke blauwe omranding
                haltesLijn510.forEach((halte) => { 
                    L.circleMarker([halte.lat, halte.lon], {
                        radius: 6,
                        color: '#005cbf',      // Blauwe buitenrand voor contrast
                        fillColor: '#ffffff',  // Witte stip
                        fillOpacity: 1,
                        weight: 2
                    }).addTo(map).bindPopup(`<b>${halte.naam}</b><br>Geplande minuut: :${halte.minuut}`); 
                });
                logDebug("Alle 46 vaste haltes als witte stippen op de kaart geplaatst.");

                // Initialiseer het live RODE bolletje voor de stadsbus
                const busMarker = L.circleMarker([53.103750, 6.885389], { 
                    radius: 12, 
                    color: '#ffffff',       // Witte rand voor zichtbaarheid
                    fillColor: '#dc3545',   // Rood bolletje
                    fillOpacity: 1, 
                    weight: 3 
                }).addTo(map);
                
                const led = document.getElementById('status-led');

                // Universele realtime GPS-fetcher die cross-origin blokkades op GitHub Pages omzeilt
                function fetchLiveGPS() {
                    logDebug("Realtime GPS opvragen via universele HTTPS AllOrigins proxy...");
                    
                    // GECORRIGEERD: De juiste endpoint met /get?url= ingebouwd
                    const targetAPI = "https://openov.nl"; 
                    const apiURL = "https://allorigins.win" + encodeURIComponent(targetAPI);

                    fetch(apiURL)
                        .then(response => {
                            if (!response.ok) throw new Error(`HTTP fout! Status: ${response.status}`);
                            return response.json();
                        })
                        .then(wrapper => {
                            // AllOrigins wikkelt de externe response veilig in een text-veld genaamd 'contents'
                            const data = JSON.parse(wrapper.contents);
                            
                            if (data && data.entity && data.entity.length > 0) {
                                // Zoek specifiek naar het voertuig van Lijn 510 in de datastream
                                const busEntity = data.entity.find(e => e.vehicle && e.vehicle.trip && e.vehicle.trip.routeId === '510');
                                
                                if (busEntity && busEntity.vehicle) {
                                    const busData = busEntity.vehicle;
                                    const liveLat = busData.position.latitude;
                                    const liveLon = busData.position.longitude;
                                    const speed = busData.position.speed ? Math.round(busData.position.speed * 3.6) : 0;

                                    logDebug(`LIVE GPS MATCH: [${liveLat}, ${liveLon}] | Snelheid: ${speed} km/u`);
                                    
                                    // Verplaats het rode bolletje live op de kaart naar de nieuwe coördinaten
                                    busMarker.setLatLng([liveLat, liveLon]);
                                    
                                    // Update het statuspaneel naar groen en toon de live data
                                    led.style.backgroundColor = '#00a83e';
                                    document.getElementById('next-stop').innerText = "Stadsbus 510 is Live";
                                    document.getElementById('tracker-msg').innerText = `Snelheid: ${speed} km/u | GPS Signaal Actief`;
                                } else {
                                    // Wel verbinding met openOV, maar specifiek lijn 510 zendt nu niks uit
                                    led.style.backgroundColor = '#6c757d';
                                    document.getElementById('next-stop').innerText = "Bus momenteel afwezig";
                                    document.getElementById('tracker-msg').innerText = "Geen actieve bus op Lijn 510 gedetecteerd";
                                    logDebug("Proxy OK! Data ontvangen, maar momenteel geen ritten actief op Lijn 510.");
                                }
                            } else {
                                led.style.backgroundColor = '#6c757d';
                                document.getElementById('next-stop').innerText = "Bus momenteel afwezig";
                                document.getElementById('tracker-msg').innerText = "Geen actieve bus gedetecteerd (Buiten dienstregeling)";
                                logDebug("Proxy verbinding geslaagd! Vervoerder meldt: momenteel geen actieve ritten.");
                            }
                        })
                        .catch(err => {
                            // Foutafhandeling die direct zichtbaar is in het debugpaneel onderin
                            logDebug(`API PROXY LEESFOUT: ${err.message}`, true);
                            led.style.backgroundColor = '#dc3545';
                            document.getElementById('next-stop').innerText = "Verbindingsfout";
                            document.getElementById('tracker-msg').innerText = "HTTPS Data stream geblokkeerd of offline";
                        });
                }

                // Start direct bij het laden van het scherm en ververs daarna automatisch elke 15 seconden
                fetchLiveGPS();
                setInterval(fetchLiveGPS, 15000);

            } catch (globalErr) {
                logDebug(`INITIALISATIEFOUT: ${globalErr.message}`, true);
            }
        };
    </script>
</body>
</html>
