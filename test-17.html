            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            transition: background-color 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #000;
            text-align: center;
            background-color: #ffffff;
        }
        .container {
            background: rgba(255, 255, 255, 0.92);
            padding: 40px 20px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            width: 85%;
            max-width: 550px;
            box-sizing: border-box;
        }
        h1 { font-size: 2.2rem; margin: 0 0 10px 0; color: #222; }
        .status-text { font-size: 2rem; font-weight: bold; text-transform: uppercase; margin: 15px 0; }
        .time-diff { font-size: 4.5rem; font-weight: 900; margin: 10px 0; }
        .info-gps { font-size: 1rem; color: #555; margin-top: 20px; }
        button {
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            background-color: #004B87;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container" id="app-box">
    <!-- PLAK DEZE REGEL HIER VOOR DE TIJD -->
    <div id="actuele-tijd" style="font-size: 1.8rem; font-weight: bold; color: #555; margin-bottom: 10px;">--:--</div>
    <h1 id="halte-naam">Lijn 510 Veendam</h1>
    <p id="status-tekst">Klik hieronder om de tracking te starten</p>
    <div class="time-diff" id="tijds-verschil">--</div>
    <button id="start-btn" onclick="startBusTracking()">START ROUTE</button>
    <p class="info-gps" id="gps-debug">GPS: Stand-by</p>
</div>

    <div style="display: none; background: #222; color: #00ff00; font-family: monospace; text-align: left; padding: 15px; margin: 20px auto; width: 85%; max-width: 550px; border-radius: 12px;">
    <h3>Live Code Monitor</h3>
    <div><b>Dichtste halte:</b> <span id="debug-stop-name">-</span></div>
    <div><b>Afstand tot halte:</b> <span id="debug-stop-dist">-</span></div>
</div>

<script>
// Volledige database van Lijn 510 - Volledig gecorrigeerd naar de echte coördinaten in Veendam
const haltesLijn510 = [

    { naam: "27. Zuideinde", minuut: 18, lat: 53.07445, lon: 6.87543 },

    { naam: "36. Finse Golf (Terug)", minuut: 28, lat: 53.10915, lon: 6.85333 },
    { naam: "37. Oostlaan (Terug)", minuut: 30, lat: 53.10657, lon: 6.86063 },
    { naam: "38. Zeilstraat (Terug)", minuut: 32, lat: 53.10373, lon: 6.86213 },

];

let watchId = null;

function startBusTracking() {
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('halte-naam').innerText = "GPS opstarten...";
    if (document.getElementById('debug-sys-status')) {
        document.getElementById('debug-sys-status').innerText = "GPS Verbinding maken...";
    }
    
    if (navigator.geolocation) {
        if (navigator.wakeLock) { navigator.wakeLock.request('screen').catch(()=>{}); }
        
        // maximumAge op 0 en timeout verhoogd om de browser te DWINGEN telkens LIVE te meten
        watchId = navigator.geolocation.watchPosition(analyseerLocatie, toonGpsFout, {
            enableHighAccuracy: true,
            maximumAge: 0, 
            timeout: 5000
        });
    } else {
        alert("Fout: Jouw telefoon ondersteunt geen GPS.");
    }
}

function analyseerLocatie(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const acc = position.coords.accuracy;
    
    if (document.getElementById('gps-debug')) {
        document.getElementById('gps-debug').innerText = `GPS Nauwkeurigheid: ${Math.round(acc)}m`;
    }
    if (document.getElementById('debug-my-lat')) {
        document.getElementById('debug-my-lat').innerText = lat.toFixed(5);
        document.getElementById('debug-my-lon').innerText = lon.toFixed(5);
        document.getElementById('debug-my-acc').innerText = Math.round(acc) + " meter";
    }

    let dichtstbijzijndeHalte = null;
    let minsteAfstand = Infinity;
    
    // Controleer alle 44 haltes met de gecorrigeerde volgorde van invoer
    haltesLijn510.forEach(halte => {
        let d = berekenAfstandInMeters(lat, lon, halte.lat, halte.lon);
        if (d < minsteAfstand) {
            minsteAfstand = d;
            dichtstbijzijndeHalte = halte;
        }
    });
    
    if (dichtstbijzijndeHalte && document.getElementById('debug-stop-name')) {
        document.getElementById('debug-stop-name').innerText = dichtstbijzijndeHalte.naam;
        document.getElementById('debug-stop-dist').innerText = Math.round(minsteAfstand) + " meter";
    }

    // Zet de zoekstraal hier voor het testen buiten op 100 meter
    if (dichtstbijzijndeHalte && minsteAfstand < 100) {
        evalueerDienstregelingstijd(dichtstbijzijndeHalte);
    } else {
        document.body.style.backgroundColor = "#e0e0e0"; 
        document.getElementById('halte-naam').innerText = "Onderweg...";
        document.getElementById('tijds-verschil').innerText = "---";
    }
}

function evalueerDienstregelingstijd(halte) {
    const nu = new Date();
    const huidigeMinuut = nu.getMinutes();

    // PLAK DEZE REGELS HIER OM DE KLOK LIVE BIJ TE WERKEN
    const uren = nu.getHours().toString().padStart(2, '0');
    const minuten = huidigeMinuut.toString().padStart(2, '0');
    document.getElementById('actuele-tijd').innerText = `${uren}:${minuten}`;
    
    document.getElementById('halte-naam').innerText = halte.naam;
    
       let verschil = huidigeMinuut - halte.minuut;
    if (verschil > 30) verschil -= 60;
    if (verschil < -30) verschil += 60;

    let weergaveVerschil = verschil > 0 ? "+" + verschil : verschil;
    document.getElementById('tijds-verschil').innerText = weergaveVerschil;

    if (verschil < 0) {
        document.body.style.backgroundColor = "#ff3b30"; // Krachtig signaalrood (Apple stijl)
        document.getElementById('status-tekst').innerText = "TE VROEG";
    } else if (verschil <= 2) {
        document.body.style.backgroundColor = "#34c759"; // Helder digitaal groen 
        document.getElementById('status-tekst').innerText = "OP TIJD";
    } else {
        document.body.style.backgroundColor = "#ffcc00"; // Fel waarschuwingsgeel 
        document.getElementById('status-tekst').innerText = "TE LAAT";
    }
}

function toonGpsFout(error) {
    document.getElementById('gps-debug').innerText = "GPS Fout: " + error.message;
}

// Deze kortere formule is 100% crash-proof en corrigeert de invoerfout
function berekenAfstandInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000; // Straal van de aarde in meters
    const radLat1 = lat1 * Math.PI / 180;
    const radLat2 = lat2 * Math.PI / 180;
    const radDeltaLon = (lon2 - lon1) * Math.PI / 180;
    
    const d = Math.acos(Math.sin(radLat1) * Math.sin(radLat2) + 
              Math.cos(radLat1) * Math.cos(radLat2) * Math.cos(radDeltaLon)) * R;
              
    return isNaN(d) ? Infinity : d;
}
