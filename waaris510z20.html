<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT-BUS510-VEENDAM-2026 - Live Tracker (Versie Z20)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { background-color: #f0f4f8; display: flex; flex-direction: column; }
        
        header { 
            background-color: #005cbf; color: white; padding: 15px; text-align: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: relative; z-index: 1000;
        }
        header h1 { font-size: 1.4rem; letter-spacing: 0.5px; }
        header p { font-size: 0.85rem; opacity: 0.85; margin-top: 3px; }

        .app-container { flex: 1; position: relative; width: 100%; display: flex; flex-direction: column; background-color: #e5e5e5; min-height: 40vh; }
        #svg-map { flex: 1; width: 100%; height: 100%; min-height: 300px; display: block; }

        #debug-console {
            background-color: #1e1e1e; color: #00ff00; font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem; padding: 15px; height: 160px; overflow-y: auto;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); border-top: 3px solid #dc3545; z-index: 2000;
        }
        .debug-entry { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 3px; }
        .debug-error { color: #ff3333; font-weight: bold; }
        .debug-success { color: #33ff33; }

        .status-panel {
            position: absolute; top: 20px; left: 20px; background: white; padding: 15px 20px; 
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 2000;
            display: flex; align-items: center; gap: 15px; width: 340px;
        }
        .pulse-indicator { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; animation: gpsPulse 1.8s infinite ease-in-out; }
        .status-info { flex: 1; }
        .status-info h3 { font-size: 0.95rem; color: #222; margin-bottom: 2px; }
        .status-info p { font-size: 0.8rem; color: #666; }
        @keyframes gpsPulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 168, 62, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(0, 168, 62, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 168, 62, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>BUS510 - VEENDAM LIVE TRACKER (Versie Z20)</h1>
        <p>PROJECT-BUS510-VEENDAM-2026 | Ingebouwde Kaart Engine</p>
    </header>

    <div class="app-container">
        <svg id="svg-map"></svg>
        <div class="status-panel">
            <div class="pulse-indicator" id="status-led" style="background-color: #6c757d;"></div>
            <div class="status-info">
                <h3 id="next-stop">Volgende halte: Berekenen...</h3>
                <p id="tracker-msg">Live GPS-simulatie actief</p>
            </div>
        </div>
        <div id="debug-console">
            <div class="debug-entry debug-success">[SYSTEM] Foutopsporingspaneel Versie Z20 geactiveerd.</div>
        </div>
    </div>

    <!-- Externe haltelijst databron koppelen -->
    <script src="haltes510.js"></script>
    <script>
        function logDebug(msg, isError = false) {
            const consoleEl = document.getElementById('debug-console');
            if (consoleEl) {
                const entry = document.createElement('div');
                entry.className = 'debug-entry' + (isError ? ' debug-error' : '');
                const timestamp = new Date().toLocaleTimeString();
                entry.innerText = `[${timestamp}] ${msg}`;
                consoleEl.appendChild(entry);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        }

        window.onerror = function(message, source, lineno, colno, error) {
            logDebug(`CRASH IN SCRIPT: ${message} op regel ${lineno}`, true);
            return false;
        };

        window.onload = function() {
            logDebug("window.onload geactiveerd. Initialiseren SVG-omgeving...");

            if (typeof haltesLijn510 === 'undefined') {
                logDebug("INITIALISATIEFOUT: Bestand 'haltes510.js' mist of is leeg.", true);
                document.getElementById('next-stop').innerText = "Data Fout!";
                document.getElementById('tracker-msg').innerText = "Bestand 'haltes510.js' mist in de map.";
                return;
            }
            logDebug(`Database succesvol uitgelezen. Aantal haltes: ${haltesLijn510.length}`);

            // GECORRIGEERD: Haalt exact de lat en lon op uit uw database
            const lats = haltesLijn510.map(h => h.lat);
            const lons = haltesLijn510.map(h => h.lon);
            const minLat = Math.min(...lats), maxLat = Math.max(...lats);
            const minLon = Math.min(...lons), maxLon = Math.max(...lons);

            const svg = document.getElementById('svg-map');
            
            // Haalt de actuele grootte van uw Chrome-venster op
            const width = svg.clientWidth || window.innerWidth || 800;
            const height = svg.clientHeight || window.innerHeight || 600;
            logDebug(`Canvas resolutie vastgesteld op: ${width}x${height} pixels.`);

            // Schermprojectie-wiskunde op basis van uw exacte coördinaten
            function project(lat, lon) {
                const padding = 50;
                const x = padding + ((lon - minLon) / (maxLon - minLon)) * (width - 2 * padding);
                const y = (height - padding) - ((lat - minLat) / (maxLat - minLat)) * (height - 2 * padding);
                return [x, y];
            }

            // GECORRIGEERD: Routepad opbouwen met de juiste lat en lon keys
            let pathData = "";
            haltesLijn510.forEach((h, i) => {
                const [x, y] = project(h.lat, h.lon);
                pathData += (i === 0 ? "M" : "L") + `${x},${y}`;
            });
            // Sluit de route-lus netjes af naar het startstation
            const [startX, startY] = project(haltesLijn510[0].lat, haltesLijn510[0].lon);
            pathData += `L${startX},${startY}`;

            const polyline = document.createElementNS("http://w3.org", "path");
            polyline.setAttribute("d", pathData);
            polyline.setAttribute("fill", "none");
            polyline.setAttribute("stroke", "#005cbf");
            polyline.setAttribute("stroke-width", "4");
            polyline.setAttribute("stroke-dasharray", "6,6");
            svg.appendChild(polyline);
            logDebug("Blauwe busroute-stippellijn succesvol gegenereerd.");

            // GECORRIGEERD: Haltes fysiek op de kaart tekenen
            haltesLijn510.forEach((h) => {
                const [x, y] = project(h.lat, h.lon);
                const circle = document.createElementNS("http://w3.org", "circle");
                circle.setAttribute("cx", x);
                circle.setAttribute("cy", y);
                circle.setAttribute("r", "5");
                circle.setAttribute("fill", "#fff");
                circle.setAttribute("stroke", "#005cbf");
                circle.setAttribute("stroke-width", "2");
                
                const title = document.createElementNS("http://w3.org", "title");
                title.textContent = h.naam;
                circle.appendChild(title);
                svg.appendChild(circle);
            });
            logDebug("Alle 46 halte-markers fysiek op het canvas geplaatst.");

            // Rode live bus tracker bol marker aanmaken
            const busDot = document.createElementNS("http://w3.org", "circle");
            busDot.setAttribute("r", "9");
            busDot.setAttribute("fill", "#e50000");
            busDot.setAttribute("stroke", "#fff");
            busDot.setAttribute("stroke-width", "3");
            svg.appendChild(busDot);

            // Dienstregelingcontrole op basis van de computerklok
            const nu = new Date();
            const day = nu.getDay(); 
            const hours = nu.getHours();
            const minutes = nu.getMinutes();
            const tijdInMinuten = (hours * 60) + minutes;

            let rijdtNu = false;
            if (day === 1) { // Maandag: 12:40 - 16:18
                rijdtNu = (tijdInMinuten >= 760 && tijdInMinuten <= 978);
            } else if (day >= 2 && day <= 6) { // Dinsdag t/m Zaterdag: 10:42 - 16:18
                rijdtNu = (tijdInMinuten >= 642 && tijdInMinuten <= 978);
            }
            logDebug(`Tijdscontrole uitgevoerd. Rijstatus: ${rijdtNu ? 'ACTIEF' : 'BUITEN DIENST'}`);

            const led = document.getElementById('status-led');
            let currentLeg = 0;
            let progress = 0;
            const stepsPerLeg = 60; // Bepaalt hoe vloeiend de bus tussen de haltes rijdt

            if (rijdtNu) {
                led.style.backgroundColor = '#00a83e';
                logDebug("Starten realtime tracking-motor...");
                updateBusTracking();
            } else {
                led.style.backgroundColor = '#6c757d';
                document.getElementById('next-stop').innerText = "Bus buiten dienst";
                document.getElementById('tracker-msg').innerText = "Buiten de actuele dienstregeling";
                busDot.setAttribute("display", "none");
            }

            function updateBusTracking() {
                try {
                    const startNode = haltesLijn510[currentLeg];
                    const endNode = haltesLijn510[(currentLeg + 1) % haltesLijn510.length];

                    const lat = startNode.lat + (endNode.lat - startNode.lat) * (progress / stepsPerLeg);
                    const lon = startNode.lon + (endNode.lon - startNode.lon) * (progress / stepsPerLeg);
                    
                    const [x, y] = project(lat, lon);
                    busDot.setAttribute("cx", x);
                    busDot.setAttribute("cy", y);

                    const nextHalte = haltesLijn510[(currentLeg + 1) % haltesLijn510.length];
                    document.getElementById('next-stop').innerText = `Volgende halte: ${nextHalte.naam}`;

                    progress++;
                    if (progress > stepsPerLeg) {
                        progress = 0;
                        currentLeg = (currentLeg + 1) % haltesLijn510.length;
                        logDebug(`Halte gepasseerd. Koers naar: ${haltesLijn510[(currentLeg + 1) % haltesLijn510.length].naam}`);
                    }

                    setTimeout(updateBusTracking, 50); 
                } catch (innerErr) {
                    logDebug(`Fout in tracker-lus: ${innerErr.message}`, true);
                }
            }
        };
    </script>
</body>
</html>
