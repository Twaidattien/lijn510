<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT-BUS510-VEENDAM-2026 - Live Tracker (Versie Z6)</title>
    <!-- Open-source Leaflet Kaartbibliotheek CSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f0f4f8; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { 
            background-color: #005cbf; color: white; padding: 15px; text-align: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: relative; z-index: 10;
        }
        header h1 { font-size: 1.4rem; letter-spacing: 0.5px; }
        header p { font-size: 0.85rem; opacity: 0.85; margin-top: 3px; }

        .app-container { flex: 1; position: relative; width: 100%; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; z-index: 1; background-color: #ddd; min-height: 50vh; }

        /* Visueel Debug Console Paneel */
        #debug-console {
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            padding: 15px;
            height: 180px;
            overflow-y: auto;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
            border-top: 3px solid #dc3545;
            z-index: 2000;
        }
        .debug-entry { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 3px; }
        .debug-error { color: #ff3333; font-weight: bold; }
        .debug-success { color: #33ff33; }

        .status-panel {
            position: absolute; top: 20px; left: 20px;
            background: white; padding: 15px 20px; border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 1000;
            display: flex; align-items: center; gap: 15px; width: 340px;
        }
        .pulse-indicator { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
        .status-info { flex: 1; }
        .status-info h3 { font-size: 0.95rem; color: #222; margin-bottom: 2px; }
        .status-info p { font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

    <header>
        <h1>BUS510 - VEENDAM LIVE TRACKER (Versie Z6)</h1>
        <p>PROJECT-BUS510-VEENDAM-2026 | Route Veendam Station - Wildervank</p>
    </header>

    <div class="app-container">
        <div id="map"></div>

        <div class="status-panel">
            <div class="pulse-indicator" id="status-led" style="background-color: #6c757d;"></div>
            <div class="status-info">
                <h3 id="next-stop">Volgende halte: Berekenen...</h3>
                <p id="tracker-msg">Live GPS-simulatie actief</p>
            </div>
        </div>

        <!-- Debug Scherm Console Ingang -->
        <div id="debug-console">
            <div class="debug-entry debug-success">[SYSTEM] Foutopsporingspaneel Versie Z6 geactiveerd. Wachten op scriptstart...</div>
        </div>
    </div>

    <!-- Open-source Leaflet Kaartbibliotheek JS -->
    <script src="https://unpkg.com"></script>
    <script>
        function logDebug(msg, isError = false) {
            const consoleEl = document.getElementById('debug-console');
            if (consoleEl) {
                const entry = document.createElement('div');
                entry.className = 'debug-entry' + (isError ? ' debug-error' : '');
                const timestamp = new Date().toLocaleTimeString();
                entry.innerText = `[${timestamp}] ${msg}`;
                consoleEl.appendChild(entry);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        }

        // Vang globale JavaScript errors af
        window.onerror = function(message, source, lineno, colno, error) {
            logDebug(`CRASH GEDETECTEERD: ${message} op regel ${lineno}:${colno}`, true);
            return false;
        };

        window.onload = function() {
            logDebug("window.onload geactiveerd. Initialiseren applicatie...");

            try {
                if (typeof L === 'undefined') {
                    throw new Error("Leaflet bibliotheek (L) is niet ingeladen via CDN!");
                }
                logDebug("Leaflet bibliotheek succesvol herkend.");

                const haltes = [
                    { name: "Veendam Station (Perron B)", coord: [53.1012, 6.7534] },
                    { name: "Veendam Centrum", coord: [53.1041, 6.7482] },
                    { name: "Langebosschedijk", coord: [53.1070, 6.7495] },
                    { name: "Zwembad (Sportcomplex)", coord: [53.1115, 6.7540] },
                    { name: "Winkelcentrum Skagerrak", coord: [53.1090, 6.7620] },
                    { name: "Finse Golf", coord: [53.1055, 6.7645] },
                    { name: "Wildervank, Westerhave", coord: [53.0872, 6.7451] },
                    { name: "Veendam Station (Eindpunt)", coord: [53.1012, 6.7534] }
                ];

                const routePoints = haltes.map(h => h.coord);
                logDebug(`Haltes ingeladen. Aantal punten: ${routePoints.length}`);
                
                logDebug("Kaartobject opbouwen via L.map...");
                const map = L.map('map').setView([53.0970, 6.7530], 13);
                logDebug("Kaart succesvol aangemaakt.");

                logDebug("OpenStreetMap tegellaag koppelen...");
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap-auteurs'
                }).addTo(map);
                logDebug("Kaarttegels succesvol gekoppeld.");

                L.polyline(routePoints, { color: '#005cbf', weight: 5, opacity: 0.75, dashArray: '1, 5' }).addTo(map);
                logDebug("Routelijn getekend.");

                haltes.forEach((halte, idx) => {
                    if(idx < haltes.length - 1) {
                        L.circleMarker(halte.coord, {
                            radius: 6, color: '#005cbf', fillColor: '#fff', fillOpacity: 1, weight: 2
                        }).addTo(map).bindPopup(`<b>Halte:</b> ${halte.name}`);
                    }
                });
                logDebug("Halte-markers geplaatst.");

                const nu = new Date();
                const day = nu.getDay(); 
                const hours = nu.getHours();
                const minutes = nu.getMinutes();
                const tijdInMinuten = (hours * 60) + minutes;

                let rijdtNu = false;
                if (day === 1) { 
                    rijdtNu = (tijdInMinuten >= 760 && tijdInMinuten <= 978);
                } else if (day >= 2 && day <= 6) { 
                    rijdtNu = (tijdInMinuten >= 642 && tijdInMinuten <= 978);
                }
                logDebug(`Dienstregeling gecontroleerd. Rijdt nu: ${rijdtNu}`);

                const led = document.getElementById('status-led');
                const busMarker = L.circleMarker([53.1012, 6.7534], {
                    radius: 11, color: '#fff', fillColor: '#e50000', fillOpacity: 1, weight: 3
                });

                let currentLeg = 0;
                let progress = 0;
                const stepsPerLeg = 150; 

                if (rijdtNu) {
                    busMarker.addTo(map);
                    led.style.backgroundColor = '#00a83e';
                    logDebug("Bus-marker toegevoegd. Starten tracker...");
                    updateBusTracking();
                } else {
                    led.style.backgroundColor = '#6c757d';
                    document.getElementById('next-stop').innerText = "Bus buiten dienst";
                    document.getElementById('tracker-msg').innerText = "Buiten de actuele dienstregeling";
                    logDebug("Bus buiten dienstregeling.");
                }

                function updateBusTracking() {
                    try {
                        let start = routePoints[currentLeg];
                        let end = routePoints[(currentLeg + 1) % routePoints.length];

                        let lat = start[0] + (end[0] - start[0]) * (progress / stepsPerLeg);
                        let lng = start[1] + (end[1] - start[1]) * (progress / stepsPerLeg);
                        
                        busMarker.setLatLng([lat, lng]);

                        let nextHalte = haltes[(currentLeg + 1) % haltes.length];
                        document.getElementById('next-stop').innerText = `Volgende halte: ${nextHalte.name}`;

                        progress++;
                        if (progress > stepsPerLeg) {
                            progress = 0;
                            currentLeg = (currentLeg + 1) % routePoints.length;
                        }

                        setTimeout(updateBusTracking, 40);
                    } catch (innerErr) {
                        logDebug(`FOUT IN TRACKING: ${innerErr.message}`, true);
                    }
                }

            } catch (globalErr) {
                logDebug(`ALGEMENE STRUIKELFOUT: ${globalErr.message}`, true);
            }
        };
    </script>
</body>
</html>
