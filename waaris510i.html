<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Buurtbus 510 Tracker - Veendam</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; background-color: #f8f9fa;
        }
        header {
            background-color: #ffc107; color: #333; padding: 20px; text-align: center; width: 90%; max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px;
        }
        h1 { margin: 0; font-size: 1.4rem; }
        #status { font-size: 1.1rem; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; }
        .online { background-color: #1e7e34; color: white; }
        .offline { background-color: #bd2130; color: white; }
        #coordinaten { margin-top: 15px; font-family: monospace; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>

    <header>
        <h1>🚌 Live Tracker: Buurtbus 510 Veendam (Versie I)</h1>
        <div id="status" style="background-color: #eee; color: #333;">Status: Gegevens ophalen...</div>
        <div id="coordinaten"></div>
    </header>

    <script>
        async function trackBus() {
            var statusEl = document.getElementById('status');
            var coordEl = document.getElementById('coordinaten');
            
            // iPad Direct-Check: We veranderen direct de tekst om te bewijzen dat het script start
            statusEl.innerHTML = "Verbinden met OV-server...";
            statusEl.style.backgroundColor = "#007bff";
            statusEl.style.color = "white";

            try {
                // We gebruiken de meest stabiele manier om de kale data op te vragen
                var targetUrl = 'https://ovapi.nl';
                var proxyUrl = 'https://corsproxy.io?' + encodeURIComponent(targetUrl);
                
                var response = await fetch(proxyUrl);
                
                if (!response.ok) {
                    statusEl.innerHTML = "🔴 OV-data service is momenteel niet bereikbaar.";
                    statusEl.className = 'offline';
                    return;
                }
                
                var data = await response.json();
                var busFound = false;

                for (var lineKey in data) {
                    if (data.hasOwnProperty(lineKey)) {
                        var lineData = data[lineKey];
                        
                        if (lineData.Actuals) {
                            for (var actualKey in lineData.Actuals) {
                                if (lineData.Actuals.hasOwnProperty(actualKey)) {
                                    var actual = lineData.Actuals[actualKey];
                                    
                                    if (actual.Latitude && actual.Longitude) {
                                        var lat = parseFloat(actual.Latitude);
                                        var lng = parseFloat(actual.Longitude);
                                        var bestemming = actual.DestinationName || 'Veendam';

                                        statusEl.innerHTML = "🟢 Live verbinding! Richting: " + bestemming;
                                        statusEl.className = 'online';
                                        
                                        coordEl.innerHTML = "Locatie van de bus:<br>Breedtegraad: " + lat + "<br>Lengtegraad: " + lng;
                                        busFound = true;
                                        break;
                                    }
                                }
                            }
                        }
                    }
                    if (busFound) { break; }
                }

                if (!busFound) {
                    statusEl.innerHTML = "⏰ De bus is momenteel offline (buiten dienst of pauze).";
                    statusEl.className = 'offline';
                    coordEl.innerHTML = "Er worden op dit moment geen live GPS-signalen uitgezonden voor lijn 510.";
                }

            } catch (error) {
                console.error(error);
                statusEl.innerHTML = "⚠️ Fout bij verbinden met de live data-feed.";
                statusEl.className = 'offline';
                coordEl.innerHTML = "De dataverbinding werd geblokkeerd of de server reageert niet.";
            }
        }

        // Start direct de meting
        trackBus();
    </script>
</body>
</html>
